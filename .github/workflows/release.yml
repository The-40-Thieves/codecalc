name: release

# Issue #24, packaging half: the Rust executor is the production path, but a
# plain `pip install codecalc` shipped only `codecalc/` — the wheel had never
# packaged bin/codecalc-exec at all, no release had ever been tagged, and the
# repository's own `.gitignore` excludes the binary and its --no-net shim as
# build artifacts. A fresh install silently ran the pure-Python fallback,
# which cannot enforce `no_net` (it says so in its own `unenforced` field).
#
# This workflow builds a PLATFORM-TAGGED wheel per target (hatch_build.py at
# the repo root force_includes the binary, sets pure_python=False and takes
# the tag from CODECALC_WHEEL_TAG — see that file), a standalone archive (binary + shim + LICENSE) per target
# for anyone not using pip, a SHA256SUMS file, and attaches all of it to the
# GitHub release. A `verify` job then installs each wheel into a clean venv —
# the way a user actually gets it — and asserts `executor.backend() == "rust"`
# and the full executor JSON contract, which is issue #24's acceptance
# criterion "CI installs the artifact exactly as a user would".
#
# Why five runners rather than five cross-compiles from one: the wheel tag is
# now stated per target (matrix.wheel_tags), so the tag no longer depends on
# the build host — but the verify job installs each wheel and RUNS the
# executor inside it, which needs a machine of that architecture. Cross-
# compiling all five from one runner would build the binaries fine and leave
# four of the five wheels unverified, which is the half of the acceptance
# criterion that actually catches a bad artifact.
# ubuntu-24.04-arm and macos-15-intel are both free, GA hosted runners for
# public repos (Linux arm64: GA Jan 2025; the Intel macOS image: available
# through Fall 2027 as GitHub sunsets x86_64 macOS).
#
# Linux musl cross-compilation reuses exactly what ci-rust.yml's
# `musl-cross-build` job already validates: cargo-zigbuild + zig as the
# linker. That gives the EXECUTOR a static binary that runs on glibc and
# musl alike.
#
# The --no-net shim (blocknet.c) is a SEPARATE artifact loaded by a
# DIFFERENT mechanism — dlopen/LD_PRELOAD by the target system's OWN
# dynamic loader at runtime, not linked into codecalc-exec — so its
# linkage does not need to match the executor's, and matching it was
# exactly the bug (issue #50): building the shim with
# `zig cc -target <arch>-linux-musl` produced a dynamically-linked object
# (NEEDED libc.so, unversioned) that a glibc system's loader cannot
# resolve. On some systems that aborts the child process with
# "invalid ELF header"; on most it just drops the LD_PRELOAD entry and
# silently runs the code with no network block at all — while the wheel
# is tagged manylinux (glibc) and every field in the JSON result still
# looks fine. The shim must match the libc the WHEEL is tagged for, not
# the libc the executor happens to be linked against.
#
# Fixed by building the shim with the RUNNER's OWN `cc`. Every `build` job
# here runs on a runner whose native architecture already matches its
# target (ubuntu-latest = x86_64, ubuntu-24.04-arm = aarch64,
# macos-latest = arm64, macos-15-intel = x86_64), so a native `cc` build
# needs no cross-compilation flag to land on the right architecture — it
# does so automatically, and it is glibc-linked on both Linux runners for
# free.
#
# What this workflow deliberately does NOT do: push a tag or create a
# release. It is validated via `workflow_dispatch` and local builds; the
# `push: tags` trigger and the release-attach step only run for real on an
# actual tag push, which this change does not make.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_to_crates:
        description: >-
          Also publish executor/ to crates.io as `codecalc-exec`, via Trusted
          Publishing (OIDC). REQUIRES ONE MANUAL PUBLISH FIRST: RFC 3691 is
          explicit that "a Trusted Publisher Configuration can only be created
          after an initial manual publishing of a crate", and pending configs
          are listed only as a future possibility. So the first release needs
          `cargo publish` with a scoped token; every one after it can come from
          here with no secret at all.
        type: boolean
        default: false
      publish_to_pypi:
        description: >-
          Also publish the built wheels to PyPI via trusted publishing (OIDC).
          Requires the GitHub -> PyPI trusted publisher to already be
          registered on the project's PyPI page (see
          https://docs.pypi.org/trusted-publishers/using-a-publisher/) — this
          repo has not registered one yet. Leave false to validate the
          build/verify/checksum pipeline without touching PyPI at all.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress: true like the CI workflows. Those cancel a
  # superseded run of the same PR/branch, which is safe because nothing about
  # an in-flight CI run is externally visible. A release build produces the
  # artifacts a tag's GitHub release will carry — killing it mid-upload on a
  # re-dispatch is how a release ends up with half its platforms attached.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64-musl
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            kind: musl
            shim: so
            exe_ext: ''
            wheel_tags: 'py3-none-manylinux_2_17_x86_64'
          - id: linux-aarch64-musl
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            kind: musl
            shim: so
            exe_ext: ''
            wheel_tags: 'py3-none-manylinux_2_17_aarch64'
          - id: macos-aarch64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            kind: native
            shim: dylib
            exe_ext: ''
            wheel_tags: 'py3-none-macosx_11_0_arm64'
          - id: macos-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            kind: native
            shim: dylib
            exe_ext: ''
            wheel_tags: 'py3-none-macosx_10_12_x86_64'
          - id: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            kind: native
            shim: none
            exe_ext: '.exe'
            wheel_tags: 'py3-none-win_amd64'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
      - if: matrix.kind == 'musl'
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with:
          version: 0.13.0
      - if: matrix.kind == 'musl'
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
          key: ${{ matrix.id }}

      - name: cargo build codecalc-exec
        working-directory: executor
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "musl" ]; then
            cargo zigbuild --release --target ${{ matrix.rust_target }}
          else
            cargo build --release --target ${{ matrix.rust_target }}
          fi

      # Same assertion as ci-rust.yml's musl-cross-build job: "it compiled" is
      # not the claim, "it is a STATIC binary" is — a dynamically linked one
      # would still build here and then fail on the old-glibc machines this
      # artifact exists for.
      - name: assert static linkage (musl targets)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          bin=executor/target/${{ matrix.rust_target }}/release/codecalc-exec
          [ -f "$bin" ] || { echo "::error::$bin was not produced"; exit 1; }
          file "$bin"
          if file "$bin" | grep -q "dynamically linked"; then
            echo "::error::$bin is dynamically linked — the musl release artifact must be static."
            exit 1
          fi
          echo "ok: statically linked, $(stat -c%s "$bin") bytes"

      # Built separately from build.rs's own copy — that one shells out to
      # plain `cc` too, for local dev builds, but this workflow needs the
      # artifact reproduced and asserted deliberately rather than inherited
      # implicitly from `cargo build`.
      #
      # ALWAYS the runner's own native `cc` — see the workflow header for why
      # that is correct here (and was NOT, for Linux, when this used to be
      # `zig cc -target <arch>-linux-musl`). Skipped on Windows: no
      # LD_PRELOAD equivalent to hang a shim on, same as ci-rust.yml's
      # `blocknet` job and codecalc/executor.py's `unenforced` reporting.
      - name: build the --no-net shim
        working-directory: executor
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.shim }}" in
            so|dylib)
              cc -shared -fPIC -O2 -Wall -Wextra -Werror -o "blocknet.${{ matrix.shim }}" blocknet.c
              ;;
            none)
              echo "windows: no shim to build (--no-net is reported unenforced)"
              ;;
          esac

      # BUILD-TIME floor: a shim that builds is not a shim that loads. Prove
      # it is linked against the libc the WHEEL is tagged for (manylinux =
      # glibc), not merely that compilation succeeded — compilation
      # succeeded for the musl-linked shim too, and that one failed to load.
      # A musl build of this exact source produces `NEEDED [libc.so]` (no
      # version — musl has no soname versioning); a glibc build produces
      # `NEEDED [libc.so.6]`. `ldd` is the strongest check available on this
      # runner: this runner's libc IS the libc the manylinux wheel is tagged
      # for (see the workflow header), so if `ldd` cannot resolve the shim
      # here, dlopen cannot resolve it on an end user's machine either.
      - name: assert the shim is linked against glibc, matching the wheel tag
        if: matrix.shim == 'so'
        working-directory: executor
        shell: bash
        run: |
          set -euo pipefail
          so=blocknet.so
          file "$so"
          needed=$(readelf -d "$so" | grep NEEDED)
          echo "$needed"
          if ! echo "$needed" | grep -q 'libc\.so\.6'; then
            echo "::error::$so is not linked against a versioned glibc libc.so.6 ($needed) — the manylinux wheel needs a glibc-linked shim, not a musl one."
            exit 1
          fi
          if ! ldd "$so"; then
            echo "::error::$so built but this runner's own dynamic loader cannot resolve it — it would fail to load for a user on the same libc the wheel is tagged for."
            exit 1
          fi
          echo "ok: $so is glibc-linked and loads on this runner"

      # The binary and its shim must travel together — a binary installed
      # without its version-matched shim silently reports --no-net as
      # unenforced instead of failing loudly. hatch_build.py force_includes
      # whatever it finds in bin/, so both land here before the wheel builds.
      - name: assemble bin/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          cp "executor/target/${{ matrix.rust_target }}/release/codecalc-exec${{ matrix.exe_ext }}" bin/
          if [ "${{ matrix.shim }}" = "so" ]; then
            cp executor/blocknet.so bin/
          elif [ "${{ matrix.shim }}" = "dylib" ]; then
            cp executor/blocknet.dylib bin/
          fi
          ls -la bin/

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: '3.12'

      # --wheel, deliberately not plain `uv build`: a plain build round-trips
      # the wheel through an sdist first, and hatchling's VCS-ignore file
      # location (locate_file(root, ".gitignore", boundary=".git")) does not
      # walk into executor/.gitignore or otherwise stop `executor/target/`
      # from being swept into the sdist — 14MB of build cache that has
      # nothing to do with a release. --wheel builds directly from the
      # working tree and never goes near that path.
      - name: build the platform wheel
        shell: bash
        env:
          WHEEL_TAGS: ${{ matrix.wheel_tags }}
        run: |
          set -euo pipefail
          rm -rf dist
          # One wheel per tag. The payload is a standalone executable with no
          # CPython ABI, so the tag is stated per target rather than inferred
          # from the build interpreter — inferring gave `cp311-cp311-...`,
          # pinning a 3.11-only wheel for a project declaring >=3.11 and
          # leaving 3.12/3.13 users to fall back to source, i.e. to the Python
          # sandbox that cannot enforce no_net.
          #
          # ONE tag per target. Publishing the Linux payload under manylinux
          # AND musllinux was tried and reverted: same payload, two tags, and
          # only one libc could be true of a single blocknet.so at a time.
          # blocknet.so is now built with the runner's own (glibc) `cc` — see
          # the workflow header — so it matches the manylinux tag this job
          # actually publishes. It does NOT make the payload musl-correct:
          # Alpine/musl users still get no Linux wheel at all here (an
          # absence, not a wrong artifact) and would need a real musl build
          # AND a musl verify environment, which is out of scope for this fix
          # (issue #50) — see the musllinux issue.
          for tag in $WHEEL_TAGS; do
            echo "::group::wheel $tag"
            CODECALC_WHEEL_TAG="$tag" uv build --wheel --out-dir dist
            echo "::endgroup::"
          done
          ls -la dist/
          # Every requested tag must have produced a file. A loop that built
          # nothing would otherwise leave this step green with an empty dist/.
          for tag in $WHEEL_TAGS; do
            plat="${tag#py3-none-}"
            ls dist/*"$plat".whl >/dev/null
          done

      # The floor on this whole workflow: prove the wheel that just built
      # actually carries the binary and actually got a platform tag, rather
      # than trusting hatch_build.py's own intent. A wheel that builds is not
      # a wheel that contains what it should.
      - name: inspect the wheel
        shell: bash
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          echo "wheel: $whl"
          case "$whl" in
            *-none-any.whl)
              echo "::error::$whl is an untagged (py3-none-any) wheel — the native executor was not bundled into it."
              exit 1
              ;;
          esac
          python3 -m zipfile -l "$whl" | tee /tmp/wheel-listing.txt
          if ! grep -q "bin/codecalc-exec${{ matrix.exe_ext }}" /tmp/wheel-listing.txt; then
            echo "::error::bin/codecalc-exec${{ matrix.exe_ext }} is not inside $whl"
            exit 1
          fi

      - name: build the standalone archive (binary + shim + LICENSE)
        shell: bash
        run: |
          set -euo pipefail
          stage="codecalc-exec-${{ matrix.id }}"
          mkdir -p "$stage"
          cp "bin/codecalc-exec${{ matrix.exe_ext }}" "$stage"/
          if [ -f bin/blocknet.so ]; then cp bin/blocknet.so "$stage"/; fi
          if [ -f bin/blocknet.dylib ]; then cp bin/blocknet.dylib "$stage"/; fi
          cp LICENSE "$stage"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "dist/${stage}.zip" "$stage" >/dev/null
          else
            tar -czf "dist/${stage}.tar.gz" "$stage"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify:
    # Issue #24's acceptance criterion: "CI installs the artifact exactly as
    # a user would and runs the contract suite against it." Not a rebuild —
    # this downloads the wheel `build` just produced and does nothing a real
    # `pip install codecalc` wouldn't also do.
    name: verify install (${{ matrix.id }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64-musl
            os: ubuntu-latest
          - id: linux-aarch64-musl
            os: ubuntu-24.04-arm
          - id: macos-aarch64
            os: macos-latest
          - id: macos-x86_64
            os: macos-15-intel
          - id: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.id }}
          path: dl
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: '3.12'
      - name: uv venv + uv pip install, exactly as a user would
        shell: bash
        run: |
          set -euo pipefail
          uv venv verify-venv
          # ABSOLUTE, deliberately. Every assertion step below runs from
          # $RUNNER_TEMP rather than the checkout, because `python -c`
          # prepends cwd to sys.path and would otherwise import the source
          # tree instead of the installed wheel. A workspace-relative
          # interpreter path stops resolving the moment they do that, which
          # is exactly what happened: `verify-venv/bin/python: No such file
          # or directory`, exit 127, on all five targets.
          if [ "${{ runner.os }}" = "Windows" ]; then
            py="$PWD/verify-venv/Scripts/python.exe"
          else
            py="$PWD/verify-venv/bin/python"
          fi
          [ -x "$py" ] || { echo "::error::interpreter not executable at $py"; exit 1; }
          echo "py=$py" >> "$GITHUB_ENV"
          whl=$(ls dl/*.whl)
          echo "installing: $whl"
          uv pip install --python "$py" "$whl"
      # EVERY assertion below runs from $RUNNER_TEMP, never the checkout.
      #
      # `python -c` prepends the current directory to sys.path, and this job
      # checks the repo out — so running the assertions from the workspace
      # imported the SOURCE TREE, not the wheel just installed. The source
      # tree's sibling bin/ is gitignored and never built in this job, so
      # every run reported `backend: python` and the job failed while the
      # wheel it was supposed to be testing was perfectly good. Verified by
      # hand: the same wheel installed into a clean venv and imported from
      # OUTSIDE the repo reports `backend: rust`, with the executable at
      # site-packages/bin/codecalc-exec and its mode bits intact.
      #
      # This job's stated purpose is "install the artifact exactly as a user
      # would". It installed like a user and then imported like a developer,
      # which is the difference between testing the artifact and testing the
      # working copy.
      #
      # `-P` (3.11+) would also stop cwd being prepended, but leaving the
      # workspace entirely is the stronger form: it cannot be defeated by a
      # later step that forgets the flag.
      - name: assert the INSTALLED package is the one under test
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Assert the POSITIVE property: codecalc resolves inside this
          # interpreter's own purelib. The first version of this check asked
          # the negative proxy "is the path outside $GITHUB_WORKSPACE", and it
          # was wrong twice over:
          #
          #   * false POSITIVE on Linux and macOS — `uv venv verify-venv` puts
          #     the venv INSIDE the workspace, so the correctly-installed
          #     package lives under $GITHUB_WORKSPACE too and got rejected.
          #   * false NEGATIVE on Windows — the path is D:\a\... and the shell
          #     glob never matched, so the step passed without checking
          #     anything. It would not have caught the source-tree import it
          #     was written for.
          #
          # sysconfig.get_paths()["purelib"] is the interpreter's own answer to
          # "where do installed packages go", so this compares against the
          # venv rather than against a path guess, and needs no separator
          # handling.
          "$py" - <<'PYEOF'
          import pathlib, sys, sysconfig

          import codecalc

          where = pathlib.Path(codecalc.__file__).resolve()
          purelib = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          print(f"codecalc:  {where}")
          print(f"purelib:   {purelib}")
          if purelib not in where.parents:
              print("::error::codecalc did not resolve inside this interpreter's "
                    "purelib, so it is not the installed distribution. Every "
                    "assertion after this would describe some other copy.")
              sys.exit(1)
          print("ok: this is the installed distribution")
          PYEOF
      - name: assert the RUST backend is what got installed
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          backend=$("$py" -c "from codecalc import executor; print(executor.backend())")
          echo "backend: $backend"
          if [ "$backend" != "rust" ]; then
            echo "::error::backend is '$backend', expected 'rust' — this wheel installed without its native executor."
            exit 1
          fi
      - name: executor JSON contract, against the INSTALLED binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          binpath=$("$py" -c "from codecalc import executor; print(executor._rust_binary())")
          echo "binary: $binpath"
          "$py" "$GITHUB_WORKSPACE/scripts/contract_check.py" "$binpath"

      # Issue #50's acceptance criterion, and the whole point of this job:
      # `backend() == "rust"` above passes even when the --no-net shim is
      # unloadable, because it says nothing about the shim at all. This
      # asserts the actual guarantee two ways, on the INSTALLED wheel:
      #
      #   1. `unenforced` must be empty — the executor's own accounting of
      #      what it could not apply.
      #   2. a real socket connect() attempt, made BY sandboxed code running
      #      with no_net=True, must actually be refused. This is the part
      #      `unenforced` alone cannot prove: the executor only checks that
      #      a shim FILE exists next to the binary, not that the target
      #      system's dynamic loader can actually resolve and load it — a
      #      musl-linked blocknet.so on a glibc host passes that file-exists
      #      check and still reports unenforced: [] while ld.so silently
      #      drops the LD_PRELOAD entry and the connection goes through.
      #      UDP connect() is used deliberately: it never sends a packet
      #      (the kernel just records the peer address), so this needs no
      #      real network reachability and cannot hang.
      #
      # Linux only: no_net is best-effort on macOS (SIP/hardened-runtime can
      # strip DYLD_INSERT_LIBRARIES outright — see blocknet.c) and entirely
      # unimplemented on Windows, both already reported via `unenforced`
      # rather than asserted here as a hard pass/fail.
      - name: no_net=True actually blocks a connection (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Same reason as the steps above: python - prepends cwd to sys.path,
          # so this must not run from the checkout or it probes the source tree.
          cd "$RUNNER_TEMP"
          "$py" - <<'PYEOF'
          import json
          from codecalc import executor

          probe_code = (
              "import socket, sys\n"
              "try:\n"
              "    s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n"
              "    s.connect(('192.0.2.1', 65535))\n"
              "    print('NETWORK_NOT_BLOCKED')\n"
              "except PermissionError:\n"
              "    print('NETWORK_BLOCKED')\n"
              "except OSError as e:\n"
              "    print('NETWORK_BLOCKED_OTHER:' + str(e))\n"
          )

          result = executor.execute("python3", probe_code, no_net=True, timeout=10)
          print(json.dumps(result, indent=2))

          unenforced = result.get("unenforced", [])
          assert unenforced == [], (
              f"no_net=True left {unenforced!r} unenforced — the executor "
              "itself says the shim did not apply. See issue #50."
          )

          stdout = result.get("stdout", "")
          assert result.get("ok") and result.get("exit_code") == 0, (
              f"sandboxed code did not run cleanly under no_net=True "
              f"(ok={result.get('ok')!r}, exit_code={result.get('exit_code')!r}, "
              f"stderr={result.get('stderr')!r}) — a shim that fails to load "
              "can crash the child instead of silently letting it through; "
              "either way the guarantee did not hold. See issue #50."
          )
          assert "NETWORK_BLOCKED" in stdout, (
              f"a real connect() attempt was NOT refused under no_net=True "
              f"(stdout={stdout!r}) — unenforced reported empty but the "
              "network was actually reachable. This is exactly the failure "
              "mode of a shim that builds and 'is present' but cannot "
              "load: e.g. a musl-linked blocknet.so on a glibc host, where "
              "ld.so silently drops a bad LD_PRELOAD entry and keeps going. "
              "See issue #50."
          )
          print("ok: no_net=True is enforced — unenforced == [] and the connect() was refused")
          PYEOF

  release-assets:
    name: checksums + attach to GitHub release
    needs: [build, verify]
    runs-on: ubuntu-latest
    # write, unlike every job above — this is the only one that touches the
    # release itself, and only reaches the upload step on a real tag push.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dl
          merge-multiple: true

      - name: SHA256SUMS, verified in this job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp dl/* dist/
          # BASENAMES, not full paths. A checksums file recording full paths
          # instead of basenames has broken verification in this project
          # before: `sha256sum -c` resolves each recorded name against a file
          # by that literal name, so a path baked in at record time stops
          # validating the moment the file is placed anywhere else — which is
          # exactly what happens between this job and wherever a user
          # downloads the release asset to.
          ( cd dist && sha256sum -- * > SHA256SUMS )
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS
          # Prove it actually validates, in THIS job, rather than trusting the
          # format — the same principle as every other gate in this repo:
          # "it wrote a file that looks like checksums" is not the claim.
          ( cd dist && sha256sum -c SHA256SUMS )

      - name: attach to the GitHub release
        # Only on an actual tag push. workflow_dispatch is how this workflow
        # is validated end-to-end WITHOUT a tag or a release existing — see
        # the workflow header. Gating on the event, not on inputs, means a
        # dispatch run can never reach `gh release create`/`upload` no matter
        # what inputs it's given.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # DRAFT, deliberately. Pushing a throwaway tag to validate this
          # pipeline has cost this project a public, non-undoable release
          # before (see the workflow header and CLAUDE.md). A draft is the
          # opposite of that: visible only to maintainers, and one `gh
          # release delete` away from never having happened, until a human
          # explicitly publishes it.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    needs: [build, verify]
    # Explicit opt-in input, checked against the dispatch event specifically
    # — `inputs.publish_to_pypi` does not exist on a `push` trigger at all, so
    # this must not be reachable from a tag push until someone deliberately
    # dispatches it. The PyPI name `codecalc` is confirmed available
    # (HTTP 404 as of writing) but no trusted publisher is registered yet, so
    # this job is wired and left off rather than attempted-and-failing.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dl
          merge-multiple: true
      - name: stage wheels only (PyPI does not accept the standalone archives)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp dl/*.whl dist/
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  publish-crates:
    name: publish to crates.io (trusted publishing)
    needs: [build, verify]
    # Same shape as publish-pypi deliberately: one dispatch releases both, off
    # the same commit and the same verified build, so the two registries cannot
    # end up carrying different code under the same version. That is the whole
    # reason this lives here rather than being run from a laptop.
    #
    # `inputs.publish_to_crates` does not exist on a `push` trigger, so a tag
    # push can never reach this — the same guard publish-pypi uses.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_crates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # Short-lived token from crates.io in exchange for the workflow's OIDC
      # identity. The action's own post step revokes it when the job ends, so
      # nothing outlives the run and there is no secret in this repository to
      # rotate, leak or forget.
      - name: authenticate to crates.io (OIDC)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish codecalc-exec
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --manifest-path executor/Cargo.toml
