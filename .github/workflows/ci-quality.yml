name: ci-quality

# Source and documentation hygiene that is neither a security gate (ci-security) nor a build
# (ci-python / ci-rust). Every job here GATES, and each earned that by being run against the repo
# first and confirmed to reach a genuine zero — an unconfigured scanner that fails on correct code
# gets muted within a week, which is worse than not having it.
#
# Measured before wiring:
#   typos      0 findings, no config needed. No _typos.toml is committed BECAUSE there is nothing
#              to except; adding an empty one would imply exceptions exist.
#   shellcheck 0 findings on the one shell script in the repo — and that script has since been
#              deleted, so the job is gone too. See below.
#
# Deliberately NOT here: shellcheck, as of the removal of executor/zig-cc.sh. That was the repo's
# only shell script, it was referenced by nothing, and it hardcoded one machine's mise shim path.
# With it gone the job's own floor fires — "shellcheck matched 0 scripts, the gate is scanning
# nothing" — which is the floor working, not a reason to weaken it to `-lt 0`. Shell coverage is not
# lost: actionlint in ci-security runs shellcheck over every embedded `run:` block, and it is where
# the repo's shell actually lives now. It caught a real SC2015 there on its first PR. Restore this
# job the moment a .sh file comes back.
#
# Deliberately NOT here: lychee. It was written, run, and then removed. README.md and AUDIT.md
# between them contain exactly ONE link — https://github.com/rust-cross/cargo-zigbuild — and it is
# external, so `lychee --offline` reports "1 Total, 0 OK, 1 Excluded": a green job that checked
# nothing. Running it online instead would gate this repo's PRs on GitHub's availability to verify a
# single URL. Add it back when there are internal cross-links worth checking.
#
# Deliberately NOT here: taplo and `cargo fmt --check`. Both are formatters over hand-authored files
# and neither can reach zero without making the files worse. taplo wants pyproject.toml's
# `dependencies` array collapsed onto one line; `cargo fmt` wants executor/src/main.rs's
# ENV_ALLOWLIST — a deliberately columnar 2-line block — exploded to one string per line, which
# makes the single most security-relevant constant in the repo harder to diff. clippy already gates
# the Rust for correctness; these two would gate only style, at the cost of reformatting layout that
# was chosen on purpose.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos (source + docs spelling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install typos v1.48.0 (pinned binary + checksum)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/typos-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/typos.tar.gz" \
            https://github.com/crate-ci/typos/releases/download/v1.48.0/typos-v1.48.0-x86_64-unknown-linux-musl.tar.gz
          echo "72a930c9a94fc3914aa56835c5b859c892a797d40c1c42638b98d93f16ff519c  $RUNNER_TEMP/typos.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-bin" ./typos
          echo "$RUNNER_TEMP/typos-bin" >> "$GITHUB_PATH"
      - name: typos
        run: typos

  readme-install-smoke:
    # THE-877 (#199, #200): nothing in CI ever ran the README's own "From
    # source" install block, so it drifted from working — `cp
    # executor/target/release/codecalc-exec bin/` with no `mkdir -p bin` first,
    # against a fresh clone where `bin/` (gitignored) does not exist. This job
    # is what would have caught that: it extracts the block FROM README.md
    # (scripts/readme_install_smoke.sh — not a hand-copied transcript, so a
    # future edit to the steps is what gets proven, not a maintainer's memory
    # of them), runs it against this checkout, and asserts `codecalc doctor`
    # comes back with the rust backend.
    #
    # Scoped to the from-source path on the toolchain this runner already has
    # (uv + the pinned Rust toolchain) — it does not attempt the other 30
    # optional runtimes `execute_code` can reach; `ci-python.yml`'s `tests` job
    # explicitly documents why that full matrix does not belong on a hosted
    # runner. `doctor` reporting a healthy rust backend with python3 resolved
    # is the from-source install's own documented success criterion.
    name: README install (from-source block, clean workdir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
      - name: run the README's own from-source install block
        run: bash scripts/readme_install_smoke.sh
