name: diag-node-windows

# DIAGNOSTIC, not a gate. Issue #42: `node` intermittently returns ok=false with
# an EMPTY stdout through the sandbox on windows-latest, while python3 and ruby
# return 42 from the same harness in the same job. It surfaced only because a
# sibling language disagreed — a node-only snippet would have been a silently
# wrong answer rather than a red check.
#
# One observation is not a reproduction. This job exists to turn "it happened
# once on PR #41 and passed on re-run" into a classified failure mode, because
# the three plausible causes need different fixes:
#
#   NONZERO_EXIT   node started and failed        -> look at stderr / env
#   TIMED_OUT      node started and hung          -> look at the kill path
#   EMPTY_EXIT_0   node exited 0 having printed   -> look at stdout capture,
#                  nothing                           which is the pipe/handle
#                                                    family the session worker
#                                                    already had on Windows
#
# `compare_execution` is a plain loop over `executor.execute`, so the primitive
# is exercised directly as well as through the tool, in case ordering or the
# preceding runs matter.
#
# workflow_dispatch ONLY. It burns Windows minutes and answers a question, so it
# runs when someone asks it, not on every push.
#
# Exit code is the finding: NON-ZERO means it reproduced and the tally above it
# says how. Green means N iterations without a reproduction, which is evidence
# about the rate rather than proof of absence — say so when quoting it.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'How many times to run each case (default 40).'
        type: string
        default: '40'
      parked:
        description: >-
          Live processes held open THROUGHOUT the loop, as sustained
          process-table pressure (default 16). Tunable without a code change so
          a re-dispatch can search for the pressure level that reproduces.
          Raising it risks exhausting the runner, which fails the job loudly
          rather than reporting a clean sweep.
        type: string
        default: '16'

permissions:
  contents: read

jobs:
  repro:
    name: node empty-stdout repro (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: '3.12'
      - name: install (locked)
        run: uv sync --frozen

      # Same as ci-python.yml's sandbox job: without this the loop below would
      # exercise the pure-Python fallback, which is NOT where the flake was seen.
      - name: build the executor into bin/
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path executor/Cargo.toml
          mkdir -p bin
          cp executor/target/release/codecalc-exec.exe bin/
          # No shim on Windows: there is no LD_PRELOAD equivalent, and the
          # executor reports --no-net as unenforced rather than pretending.

      # FLOOR. A diagnostic that loops 40 times against a missing runtime, or
      # against the fallback backend, would report "no reproduction" for reasons
      # that have nothing to do with the question. Both are asserted before any
      # measurement, and both fail loudly.
      - name: assert the RUST backend and node are what we are measuring
        shell: bash
        run: |
          set -euo pipefail
          backend=$(uv run --no-sync python -c 'from codecalc import executor; print(executor.backend())')
          echo "backend: $backend"
          [ "$backend" = "rust" ] || { echo "::error::backend is '$backend', expected 'rust' — this would measure the fallback."; exit 1; }
          avail=$(uv run --no-sync python -c "from codecalc import executor; print(executor.probe().get('node'))" 2>/dev/null || echo unknown)
          echo "node available (probe): $avail"

      - name: loop the node case and classify every failure
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          # A workflow_dispatch input is free text. Reject a non-number here
          # rather than letting int() raise inside the driver, where the error
          # would read as a harness fault instead of a bad argument.
          case "$ITERATIONS" in
            ''|*[!0-9]*) echo "::error::iterations must be a positive integer, got '$ITERATIONS'"; exit 1 ;;
          esac
          uv run --no-sync python - "$ITERATIONS" <<'PY'
          import collections, json, sys

          from codecalc import executor, tools

          n = int(sys.argv[1])
          SNIPPETS = {"python3": "print(6*7)", "node": "console.log(6*7)", "ruby": "puts 6*7"}

          def classify(r):
              """Which of the three candidate failure modes this result is.

              EMPTY_EXIT_0 is the one worth finding: it is a wrong answer that
              looks like a valid one, and it is the only mode that implicates
              stdout capture rather than node itself.
              """
              if r.get("ok") and r.get("stdout", "").strip() == "42":
                  return "OK"
              if r.get("timed_out"):
                  return "TIMED_OUT"
              if not r.get("stdout", "").strip():
                  return "EMPTY_EXIT_0" if r.get("exit_code") == 0 else "NONZERO_EXIT_EMPTY"
              return "OTHER"

          tally = collections.Counter()
          samples = {}
          ran = 0

          for i in range(n):
              # (a) the primitive, isolated
              r = executor.execute("node", SNIPPETS["node"], timeout=15)
              kind = classify(r)
              tally[f"direct:{kind}"] += 1
              ran += 1
              if kind != "OK" and f"direct:{kind}" not in samples:
                  samples[f"direct:{kind}"] = {
                      "iteration": i, "ok": r.get("ok"), "exit_code": r.get("exit_code"),
                      "verdict": r.get("verdict"), "timed_out": r.get("timed_out"),
                      "duration_ms": r.get("duration_ms"),
                      "stdout": r.get("stdout", "")[:120],
                      "stderr": str(r.get("stderr", ""))[:400],
                      "unenforced": r.get("unenforced"),
                  }

              # (b) through the tool, exactly as the failing assertion called it
              c = tools.compare_execution(SNIPPETS, timeout=15)
              for row in c.get("results", []):
                  if row.get("language") != "node":
                      continue
                  kind = classify(row)
                  tally[f"compare:{kind}"] += 1
                  if kind != "OK" and f"compare:{kind}" not in samples:
                      samples[f"compare:{kind}"] = {
                          "iteration": i, "row": {k: str(v)[:200] for k, v in row.items()},
                          "fastest": c.get("fastest"),
                          "siblings": {x.get("language"): x.get("stdout", "").strip()
                                       for x in c.get("results", [])},
                      }

          # A loop that ran fewer times than asked would make every count below
          # mean something other than what it says.
          if ran != n:
              print(f"::error::loop ran {ran} times, expected {n}")
              sys.exit(2)

          print(f"\n=== {n} iterations, node on {sys.platform} ===")
          for key in sorted(tally):
              print(f"  {key:28} {tally[key]}")
          if samples:
              print("\n=== first sample of each failure mode ===")
              print(json.dumps(samples, indent=2, default=str))

          bad = sum(v for k, v in tally.items() if not k.endswith(":OK"))
          if bad:
              print(f"\n=== REPRODUCED: {bad} non-OK results in {n} iterations ===")
              sys.exit(1)
          print(f"\n=== no reproduction in {n} iterations ===")
          print("Evidence about the RATE, not proof of absence. #41 hit it once "
                "in a single run, so a clean pass here bounds the frequency "
                "rather than closing the issue.")
          PY

  in-situ:
    # The isolated loop above found nothing in 580 executions across two
    # dispatches, which bounds the rate rather than closing #42. The original
    # failure did NOT happen in isolation: it happened inside
    # `sandbox + security (windows-latest)`, part-way through the full suite,
    # after the fork-bomb and process-limit probes had run.
    #
    # 580 clean isolated runs against one failure under load points away from
    # "node is flaky" and toward contention or leftover state — most plausibly
    # job-object ActiveProcessLimit pressure after those probes, or a prior
    # test leaving a handle behind. This job tests that reading directly: it
    # reproduces the sandbox job's setup, runs the SAME heavy suites first,
    # and only then loops node.
    #
    # If this reproduces where the clean job does not, the difference between
    # them IS the finding.
    name: node repro AFTER the heavy suites (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: '3.12'
      - name: install (locked)
        run: uv sync --frozen
      - name: build the executor into bin/
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path executor/Cargo.toml
          mkdir -p bin
          cp executor/target/release/codecalc-exec.exe bin/
      - name: assert the RUST backend is what we are measuring
        shell: bash
        run: |
          set -euo pipefail
          backend=$(uv run --no-sync python -c 'from codecalc import executor; print(executor.backend())')
          [ "$backend" = "rust" ] || { echo "::error::backend is '$backend'"; exit 1; }
          echo "backend: $backend"

      # THE LOAD IS HELD OPEN, and that is the whole change.
      #
      # The previous version ran the heavy suites and THEN looped. Sequential,
      # not concurrent: the fork-bomb and process-limit probes were killed and
      # reaped before the first node execution started, so whatever pressure
      # they created was gone before anything was measured. 80 clean
      # executions on 2026-08-09 therefore said "node is fine after a busy
      # period" when the hypothesis is "node misbehaves during one".
      #
      # Now: park a set of live processes, run the heavy suites on repeat in
      # the background, and loop node WHILE both are running.
      #
      # The floors matter more than the loop. A diagnostic whose load dies
      # early reports "no reproduction" for a reason that has nothing to do
      # with node — which is exactly the mistake this step replaces — so the
      # load is asserted alive both before and after the measurement, and the
      # job FAILS LOUDLY if it was not, rather than reporting a clean sweep.
      - name: loop node WHILE the load is live
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations }}
          PARKED: ${{ inputs.parked }}
        run: |
          set -euo pipefail
          for v in ITERATIONS PARKED; do
            eval "val=\$$v"
            case "$val" in
              ''|*[!0-9]*) echo "::error::$v must be a positive integer, got '$val'"; exit 1 ;;
            esac
          done
          uv run --no-sync python - "$ITERATIONS" "$PARKED" <<'PY'
          import collections, json, subprocess, sys, time

          from codecalc import executor, tools

          n = int(sys.argv[1])
          parked_n = int(sys.argv[2])
          SNIPPETS = {"python3": "print(6*7)", "node": "console.log(6*7)", "ruby": "puts 6*7"}
          SUITES = ["tests/test_security.py", "tests/test_executor_sweep.py",
                    "tests/test_platform_contract.py"]
          #: Wall-clock ceiling on the background load. Without it a hung child
          #: would outlive the step and hold the runner.
          LOAD_SECONDS = 1800

          def classify(r):
              """Which of the three candidate failure modes this result is.

              EMPTY_EXIT_0 is the one worth finding: a wrong answer that looks
              like a valid one, and the only mode implicating stdout capture
              rather than node itself.
              """
              if r.get("ok") and r.get("stdout", "").strip() == "42":
                  return "OK"
              if r.get("timed_out"):
                  return "TIMED_OUT"
              if not r.get("stdout", "").strip():
                  return "EMPTY_EXIT_0" if r.get("exit_code") == 0 else "NONZERO_EXIT_EMPTY"
              return "OTHER"

          def alive(procs):
              return sum(1 for p in procs if p.poll() is None)

          parked, suite_proc = [], None
          try:
              # Sustained process-table pressure. Spawned rather than forked:
              # os.fork does not exist on Windows, which is the platform in
              # question.
              for _ in range(parked_n):
                  parked.append(subprocess.Popen(
                      [sys.executable, "-c", f"import time; time.sleep({LOAD_SECONDS})"],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL))

              # The heavy suites, on repeat, so they are still running when the
              # last node iteration goes out. Output discarded: their verdicts
              # are not what this job asks, they are here to churn processes,
              # handles and job objects the way the original failing run did.
              runner = (
                  "import subprocess, sys, time\n"
                  f"end = time.time() + {LOAD_SECONDS}\n"
                  "while time.time() < end:\n"
                  f"    for t in {SUITES!r}:\n"
                  "        subprocess.run([sys.executable, t],\n"
                  "                       stdout=subprocess.DEVNULL,\n"
                  "                       stderr=subprocess.DEVNULL)\n"
              )
              suite_proc = subprocess.Popen([sys.executable, "-c", runner],
                                            stdout=subprocess.DEVNULL,
                                            stderr=subprocess.DEVNULL)
              time.sleep(15)  # let the suites actually get going

              # ── FLOOR, before measuring anything ────────────────────────
              before = alive(parked)
              print(f"load: {before}/{parked_n} parked processes alive, "
                    f"suites running={suite_proc.poll() is None}")
              if before < parked_n:
                  print(f"::error::only {before}/{parked_n} parked processes survived "
                        "startup — the load is not what this job claims to measure")
                  sys.exit(2)
              if suite_proc.poll() is not None:
                  print("::error::the background suite runner exited before the loop "
                        "started — there is no concurrent load")
                  sys.exit(2)

              tally, samples, ran = collections.Counter(), {}, 0
              for i in range(n):
                  r = executor.execute("node", SNIPPETS["node"], timeout=15)
                  k = classify(r); tally[f"direct:{k}"] += 1; ran += 1
                  if k != "OK" and f"direct:{k}" not in samples:
                      samples[f"direct:{k}"] = {
                          "iteration": i, "exit_code": r.get("exit_code"),
                          "verdict": r.get("verdict"), "timed_out": r.get("timed_out"),
                          "duration_ms": r.get("duration_ms"),
                          "stderr": str(r.get("stderr", ""))[:400],
                          "load_alive": alive(parked)}
                  c = tools.compare_execution(SNIPPETS, timeout=15)
                  for row in c.get("results", []):
                      if row.get("language") != "node":
                          continue
                      k = classify(row); tally[f"compare:{k}"] += 1
                      if k != "OK" and f"compare:{k}" not in samples:
                          samples[f"compare:{k}"] = {
                              "iteration": i,
                              "siblings": {x.get("language"): x.get("stdout", "").strip()
                                           for x in c.get("results", [])},
                              "load_alive": alive(parked)}

              # ── FLOOR, after ───────────────────────────────────────────
              after = alive(parked)
              suites_still = suite_proc.poll() is None
              print(f"\nload at end: {after}/{parked_n} parked alive, "
                    f"suites running={suites_still}")
              if ran != n:
                  print(f"::error::loop ran {ran} times, expected {n}")
                  sys.exit(2)
              if after < parked_n or not suites_still:
                  print("::error::the load did not survive the measurement, so a clean "
                        "result here would mean nothing. Re-run with a smaller "
                        "`parked` or a longer LOAD_SECONDS.")
                  sys.exit(2)

              print(f"\n=== {n} iterations UNDER LIVE LOAD, node on {sys.platform} ===")
              print(f"    ({parked_n} parked processes + the heavy suites on repeat, "
                    "both confirmed running throughout)")
              for key in sorted(tally):
                  print(f"  {key:28} {tally[key]}")
              if samples:
                  print("\n=== first sample of each failure mode ===")
                  print(json.dumps(samples, indent=2, default=str))

              bad = sum(v for k, v in tally.items() if not k.endswith(":OK"))
              if bad:
                  print(f"\n=== REPRODUCED UNDER LIVE LOAD: {bad} non-OK in {n} ===")
                  print("The isolated job does not reproduce this. The difference "
                        "between the two jobs is the finding.")
                  sys.exit(1)
              print(f"\n=== no reproduction in {n} iterations under live load ===")
              print("Bounds the rate under concurrent pressure too. #42 stays open.")
          finally:
              for p in parked:
                  try:
                      p.kill()
                  except OSError:
                      pass
              if suite_proc is not None:
                  try:
                      suite_proc.kill()
                  except OSError:
                      pass
          PY
