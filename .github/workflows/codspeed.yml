name: codspeed

# Performance benchmarks, measured with CodSpeed's CPU simulation instrument so the numbers are
# deterministic across runners. The suite lives in benchmarks/ (a real pytest suite, unlike tests/).
#
# pytest and pytest-codspeed are added ad hoc with `uv run --with`, the same way the mutation lane
# adds mutmut: neither belongs in pyproject.toml or uv.lock, so the install the rest of CI tests
# (`uv sync --locked --all-extras`) is exactly what gets benchmarked.

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger backtest runs to build an initial history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_PIN: '9.0.2'
  PYTEST_CODSPEED_PIN: '5.0.3'

jobs:
  benchmarks:
    name: benchmarks (CodSpeed simulation)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: '3.12'
      # --no-build: every dependency installs from a locked wheel, so no package setup script runs.
      # --no-install-project: codecalc itself is imported from the checkout via PYTHONPATH (set on
      # the job below), the same way README's test instructions run the suite.
      - name: install (locked, with extras, wheels only)
        run: uv sync --locked --all-extras --no-build --no-install-project
      # analyze_complexity fetches tree-sitter grammars on first use. Fetch them up front (and cache
      # them, same key as ci-python) so no download ever lands inside a measured benchmark.
      - name: resolve the grammar cache directory
        id: grammar-cache
        run: echo "dir=$(uv run --no-sync --no-build python scripts/prefetch_grammars.py --print-cache-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.grammar-cache.outputs.dir }}
          key: tslp-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: prefetch grammars
        run: uv run --no-sync --no-build python scripts/prefetch_grammars.py
      - name: run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: uv run --no-sync --no-build --with "pytest==${{ env.PYTEST_PIN }}" --with "pytest-codspeed==${{ env.PYTEST_CODSPEED_PIN }}" pytest benchmarks/ --codspeed
