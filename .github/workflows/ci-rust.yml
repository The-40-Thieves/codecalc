name: ci-rust

# The Rust executor is the security boundary: it is the only thing standing between a model-supplied
# program and this host. It had no CI at all.
#
# Note what is deliberately NOT here: a bare `cargo test` job. executor/src/main.rs contains zero
# `#[test]` functions, so `cargo test` exits 0 having run nothing — a green check that proves the
# crate compiles and nothing else. Rather than ship that, the `contract` job below RUNS the built
# binary and asserts its JSON output, which is the interface Python actually depends on. If unit
# tests are added later, add a floor on the test count alongside them (an `ok. 0 passed` line reads
# identically to a passing suite).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: executor
      # --all-targets/--all-features so a lint cannot hide in a cfg'd branch; -D warnings so a new
      # lint in a toolchain bump lands as a red PR rather than scrollback nobody reads. The crate is
      # at a genuine zero today, which is what makes -D affordable.
      - name: cargo clippy
        working-directory: executor
        run: cargo clippy --all-targets --all-features -- -D warnings

  contract:
    name: executor binary contract (build + run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: executor
      - name: build release
        working-directory: executor
        run: cargo build --release
      # Every assertion below is on OBSERVED output of the real binary, not on the source. These are
      # the four properties codecalc/executor.py parses out of it; if any changes shape, the Python
      # side silently degrades to `{"ok": false, "error": "executor produced invalid output"}`.
      - name: assert the JSON contract
        run: |
          set -euo pipefail
          BIN=executor/target/release/codecalc-exec

          echo "— --languages returns a non-empty JSON array"
          langs=$("$BIN" --languages)
          count=$(echo "$langs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "languages: $count"
          [ "$count" -ge 30 ] || { echo "::error::--languages returned $count entries, expected >= 30"; exit 1; }

          echo "— a successful run reports ok/verdict OK/stdout"
          out=$(echo 'print("hello")' | "$BIN" --lang python3 --timeout 20)
          echo "$out"
          python3 - "$out" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          assert d["ok"] is True, d
          assert d["verdict"] == "OK", d
          assert d["stdout"].strip() == "hello", d
          for k in ("exit_code", "duration_ms", "cpu_ms", "peak_memory_kb", "timed_out"):
              assert k in d, f"missing key {k}: {d}"
          print("ok: success shape")
          PY

          echo "— a wall-clock overrun is killed and reported as TLE"
          out=$(echo 'while True: pass' | "$BIN" --lang python3 --timeout 3)
          python3 - "$out" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          assert d["timed_out"] is True, d
          assert d["verdict"] == "TLE", d
          print("ok: TLE")
          PY

          echo "— output over the cap is truncated and reported as OLE"
          out=$(echo 'print("x" * 200000)' | "$BIN" --lang python3 --timeout 20)
          python3 - "$out" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          assert len(d["stdout"]) < 70_000, len(d["stdout"])
          assert d["verdict"] == "OLE", d
          print("ok: OLE")
          PY

          echo "— an unknown language is a structured error, not a crash"
          out=$(echo 'x' | "$BIN" --lang notalanguage --timeout 5)
          python3 - "$out" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          assert d["ok"] is False and "unknown language" in d["error"], d
          print("ok: unknown language")
          PY

      # AUDIT.md CRITICAL-02. The env allowlist is the fix for secrets leaking into executed code,
      # and it is enforced in the Rust binary at spawn time — so it can only be verified by running
      # the binary with a secret in its own environment and checking the child cannot see it.
      # scripts/check_parity.py checks the two allowlists MATCH; this checks the Rust one WORKS.
      - name: assert executed code cannot read the executor's environment
        env:
          FAKE_API_KEY: codecalc-ci-canary-do-not-leak
        run: |
          set -euo pipefail
          out=$(echo 'import os; print(os.environ.get("FAKE_API_KEY", "CLEAN"))' \
                | executor/target/release/codecalc-exec --lang python3 --timeout 20)
          echo "$out"
          python3 - "$out" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          got = d["stdout"].strip()
          assert got == "CLEAN", f"SECRET LEAKED TO EXECUTED CODE: {got!r}"
          print("ok: env allowlist holds — the canary did not reach the child")
          PY

  musl-cross-build:
    # codecalc's portability claim is the two static musl binaries in bin/ ("run on any Linux
    # regardless of glibc version"). That build path runs on one developer machine with a
    # hand-installed zig, has never been exercised anywhere else, and produces the artifacts users
    # are told to rely on. Build both here so a broken cross-build fails on a PR.
    name: musl cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: executor
          key: ${{ matrix.target }}
      - name: cargo zigbuild
        working-directory: executor
        run: cargo zigbuild --release --target ${{ matrix.target }}
      # "It compiled" is not the claim. The claim is a STATIC binary — a dynamically linked one would
      # still build here and then fail on the old-glibc machines this artifact exists for.
      - name: assert the artifact is actually static
        run: |
          set -euo pipefail
          bin=executor/target/${{ matrix.target }}/release/codecalc-exec
          [ -f "$bin" ] || { echo "::error::$bin was not produced"; exit 1; }
          file "$bin"
          if file "$bin" | grep -q "dynamically linked"; then
            echo "::error::$bin is dynamically linked — the musl artifact must be static."
            exit 1
          fi
          echo "ok: statically linked, $(stat -c%s "$bin") bytes"

  blocknet:
    # The --no-net shim. It is built by a comment in blocknet.c and by hand; nothing verifies it
    # still compiles, and a broken shim degrades silently — the executor checks `shim.is_file()` and
    # just skips LD_PRELOAD if it is missing, so `no_net: true` would report success while doing
    # nothing at all.
    name: blocknet.so (--no-net shim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: build the shim
        working-directory: executor
        run: gcc -shared -fPIC -O2 -Wall -Wextra -Werror -o blocknet.so blocknet.c
      - name: assert it exports the symbols it overrides
        run: |
          set -euo pipefail
          syms=$(nm -D --defined-only executor/blocknet.so | awk '{print $3}')
          echo "$syms"
          for s in socket connect; do
            grep -qx "$s" <<<"$syms" || { echo "::error::blocknet.so does not define $s"; exit 1; }
          done
          # socketpair must NOT be overridden — tokio/libuv use it for internal signal plumbing and
          # blocking it crashes the runtime rather than the network call. AUDIT.md item 4.
          if grep -qx socketpair <<<"$syms"; then
            echo "::error::blocknet.so overrides socketpair(); this breaks tokio/libuv runtimes."
            exit 1
          fi
          echo "ok: overrides socket+connect, leaves socketpair alone"
      - name: assert it actually blocks an outbound connection
        run: |
          set -euo pipefail
          cat > /tmp/net.py <<'PY'
          import socket, sys
          try:
              socket.create_connection(("1.1.1.1", 80), timeout=5)
              print("CONNECTED")
          except OSError as e:
              print("BLOCKED", e.errno)
          PY
          echo "without the shim:"; python3 /tmp/net.py
          echo "with the shim:"
          out=$(LD_PRELOAD=$PWD/executor/blocknet.so python3 /tmp/net.py)
          echo "$out"
          grep -q BLOCKED <<<"$out" || { echo "::error::blocknet.so did not block the connection"; exit 1; }
