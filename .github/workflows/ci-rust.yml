name: ci-rust

# The Rust executor is the security boundary: it is the only thing standing between a model-supplied
# program and this host. It had no CI at all.
#
# There IS a `cargo test` job now, and it carries the floor this note used to ask for. The note
# previously read "executor/src/main.rs contains zero `#[test]` functions", which stopped being true
# without anyone noticing: the crate had four, and no workflow ran them, so they sat in the tree
# looking like coverage for however long it took to add the first one and not come back here. The
# floor is what makes the job worth having — `ok. 0 passed` and `ok. 9 passed` are both green, and
# only the count tells a suite that ran from a filter that matched nothing.
#
# The `contract` job below is still the load-bearing one: it RUNS the built binary and asserts its
# JSON output, which is the interface Python actually depends on. Unit tests cover the pure helpers
# that have no other way to be reached — argv rendering, timeout arithmetic.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    # Runs on all three OSes, not just Linux. The platform backends are behind
    # #[cfg], so a Linux-only clippy compiles NONE of the Windows code and half
    # of the macOS-relevant code — the first cross-check of this port found that
    # `libc::__rlimit_resource_t` is glibc-only and that `suseconds_t` is i32 on
    # macOS against i64 on Linux, so the CPU-time arithmetic did not even
    # type-check there. Neither is visible from an ubuntu runner.
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          # rustfmt as well as clippy: the fmt step below needs it, and this
          # input is what the composite hands to dtolnay/rust-toolchain, so the
          # `components` list in rust-toolchain.toml does not cover it here.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
          key: ${{ matrix.os }}
      # --all-targets/--all-features so a lint cannot hide in a cfg'd branch; -D warnings so a new
      # lint in a toolchain bump lands as a red PR rather than scrollback nobody reads. The crate is
      # at a genuine zero today, which is what makes -D affordable.
      - name: cargo clippy
        working-directory: executor
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings
      # ONE runner, not the matrix: rustfmt's output depends on the source and the
      # toolchain, both identical across the three, so the other two would only
      # re-confirm the same answer more slowly. The toolchain is pinned in
      # rust-toolchain.toml, which is what makes that safe to assume — an
      # unpinned rustfmt could legitimately differ between runners.
      #
      # This gate went in AFTER the tree was already non-compliant: `cargo fmt`
      # rewrote 401 lines across four files in the same commit. That reformat is
      # provably cosmetic rather than merely believed to be — `.text`, `.rodata`,
      # `.data` and `.eh_frame` are byte-identical before and after, and the only
      # section that moved is `.data.rel.ro`, which holds the core::panic::Location
      # line/column constants that shift when lines do.
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        working-directory: executor
        shell: bash
        run: cargo fmt --check
      # The header used to say this crate had zero `#[test]` functions, so a
      # `cargo test` job would be a green check proving nothing. It had FOUR,
      # and they had never run: the comment stayed accurate for exactly as long
      # as it took someone to add the first test and not revisit it.
      #
      # So the floor the header asked for is here, and it is the point of the
      # step rather than a decoration. `ok. 0 passed` and `ok. 9 passed` are
      # both green; only the count distinguishes a suite that ran from a filter
      # expression that matched nothing. Runs on the full matrix because
      # source_arg's Windows branch takes `windows` as a parameter specifically
      # so all three legs exercise it.
      - name: cargo test (with a floor on the count)
        working-directory: executor
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log
          # SUM every suite, do not take the first. The crate has more than one
          # test binary (src/main.rs and src/bin/jobprobe.rs), cargo does not
          # guarantee which runs first, and jobprobe has no #[test] of its own —
          # so `head -1` read 9 or 0 depending on an ordering nothing pins. It
          # happened to read 9; that is luck, not a gate.
          n=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' test.log \
              | awk '{s += $1} END {print s + 0}')
          echo "rust unit tests passed: ${n:-0}"
          [ "${n:-0}" -ge 23 ] || {
            echo "::error::expected at least 23 rust unit tests, ran ${n:-0} — the suite did not run"
            exit 1
          }

  contract:
    # The claim is that codecalc works on Linux, macOS and Windows. That claim is
    # only worth what it is tested against, so the contract runs on all three.
    name: executor contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
          key: ${{ matrix.os }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: build release
        working-directory: executor
        shell: bash
        run: cargo build --release
      # Every assertion is on OBSERVED output of the real binary, not on source.
      # The checker is Python rather than a bash heredoc: the previous version
      # could only run on a POSIX shell, which is a poor way to test a
      # cross-platform claim. It probes which runtimes the runner actually has
      # and FAILS if none — "nothing was executable" must not read as "passed".
      - name: executor JSON contract
        shell: bash
        run: python scripts/contract_check.py executor/target/release/codecalc-exec${{ runner.os == 'Windows' && '.exe' || '' }}

  musl-cross-build:
    # codecalc's portability claim is the two static musl binaries in bin/ ("run on any Linux
    # regardless of glibc version"). That build path runs on one developer machine with a
    # hand-installed zig, has never been exercised anywhere else, and produces the artifacts users
    # are told to rely on. Build both here so a broken cross-build fails on a PR.
    name: musl cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
          key: ${{ matrix.target }}
      - name: cargo zigbuild
        working-directory: executor
        run: cargo zigbuild --release --target ${{ matrix.target }}
      # "It compiled" is not the claim. The claim is a STATIC binary — a dynamically linked one would
      # still build here and then fail on the old-glibc machines this artifact exists for.
      - name: assert the artifact is actually static
        run: |
          set -euo pipefail
          bin=executor/target/${{ matrix.target }}/release/codecalc-exec
          [ -f "$bin" ] || { echo "::error::$bin was not produced"; exit 1; }
          file "$bin"
          if file "$bin" | grep -q "dynamically linked"; then
            echo "::error::$bin is dynamically linked — the musl artifact must be static."
            exit 1
          fi
          echo "ok: statically linked, $(stat -c%s "$bin") bytes"

  blocknet:
    # The --no-net shim. `executor/build.rs` now builds it as part of `cargo build`, so it cannot
    # lag blocknet.c; this job is the cross-platform gate on top of that — it proves the shim still
    # compiles -Werror on macOS as well as Linux, and that the override MECHANISM survives.
    #
    # A broken shim degrades silently, so both halves matter: the executor checks `shim.is_file()`
    # and skips LD_PRELOAD if it is missing, reporting `no_net_requested_but_no_shim_available` in
    # `unenforced` (verified). A STALE shim is the case nothing can report — the file is there, so
    # the policy being enforced is the previous build while every presence check passes. That is
    # what build.rs removes.
    #
    # Linux and macOS only. Windows has no LD_PRELOAD equivalent to hang a socket
    # shim on, so `--no-net` is reported through the executor's `unenforced` field
    # there rather than silently doing nothing — see src/platform/mod.rs.
    name: blocknet shim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib: blocknet.so
          - os: macos-latest
            lib: blocknet.dylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the shim
        working-directory: executor
        shell: bash
        # -shared works for both; macOS produces a Mach-O dylib from the same
        # source because the shim only overrides socket()/connect().
        run: cc -shared -fPIC -O2 -Wall -Wextra -Werror -o ${{ matrix.lib }} blocknet.c
      # The two platforms use different mechanisms, so the static check differs
      # too. Linux: the shim DEFINES socket/connect and they must be exported.
      # macOS: two-level namespace means defining them does nothing, so the
      # replacements are static and dyld applies a __DATA,__interpose section —
      # which is what must be present there.
      - name: assert the override mechanism is actually in the artifact
        shell: bash
        run: |
          set -euo pipefail
          lib=executor/${{ matrix.lib }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Segment-AGNOSTIC on purpose. The first version of this check asked
            # otool for `__DATA __interpose` specifically and got nothing, because
            # modern ld places the section in __DATA_CONST — the pointers are
            # write-once. Naming the segment made a present, working section look
            # absent. `size -m` lists every segment with its sections, so this
            # finds it wherever the linker put it.
            size -m "$lib" | sed -n '/Segment/,$p'
            bytes=$(size -m "$lib" | awk '/Section __interpose/ {print $NF; exit}')
            echo "__interpose section: ${bytes:-absent} bytes"
            if [ -z "${bytes:-}" ]; then
              echo "::error::$lib has no __interpose section in ANY segment; dyld would ignore it."
              exit 1
            fi
            # Each entry is a {replacement, replacee} pair of 8-byte pointers, so
            # two interposed functions is 32 bytes. Fewer means one silently
            # dropped, which is how half a shim ships.
            [ "$bytes" -ge 32 ] || { echo "::error::__interpose is $bytes bytes; expected >= 32 for 2 entries."; exit 1; }
            refs=$(nm -u "$lib" | sed 's/^_//' | sort -u)
          else
            refs=$(nm -g --defined-only "$lib" | awk '{print $3}')
          fi
          echo "$refs"
          for s in socket connect; do
            grep -qx "$s" <<<"$refs" || { echo "::error::${{ matrix.lib }} does not reference $s"; exit 1; }
          done
          # socketpair must NOT be touched — tokio/libuv use it for internal
          # signal plumbing and blocking it crashes the runtime. AUDIT.md item 4.
          if grep -qx socketpair <<<"$refs"; then
            echo "::error::${{ matrix.lib }} touches socketpair(); this breaks tokio/libuv runtimes."
            exit 1
          fi
          echo "ok: socket+connect covered, socketpair untouched"
      - name: assert it actually blocks an outbound connection
        shell: bash
        # The probe is a C program compiled HERE, not the runner's python3.
        #
        # macOS SIP strips DYLD_INSERT_LIBRARIES for protected and hardened-runtime
        # binaries, and the hosted python3 is signed that way — so preloading
        # against it silently does nothing and the job reported CONNECTED with the
        # shim applied. That is a true statement about macOS, but it tests Apple's
        # code signing rather than this shim. A locally built, unsigned binary is
        # the subject we actually care about, and it removes the dependency on how
        # a given runner's interpreter happens to be signed.
        #
        # The real-world caveat this does NOT paper over is recorded in
        # AUDIT.md and README: on macOS `--no-net` is best-effort and does not
        # apply to SIP-protected or hardened binaries.
        run: |
          set -euo pipefail
          cat > /tmp/netprobe.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <netinet/in.h>
          #include <arpa/inet.h>
          /* Two INDEPENDENT results, because "blocked the network" and "blocked
           * every socket" are different outcomes and the shim shipped as the
           * second one for a while. A probe that only tries AF_INET cannot tell
           * them apart: a shim refusing every address family passes it, while
           * taking out AF_UNIX local IPC — no network involved — under a flag
           * that says "no net". So AF_UNIX must SUCCEED for the gate to pass. */
          int main(void) {
              int u = socket(AF_UNIX, SOCK_STREAM, 0);
              printf("%s ", u < 0 ? "UNIX_BLOCKED" : "UNIX_OK");
              int fd = socket(AF_INET, SOCK_STREAM, 0);
              if (fd < 0) { printf("BLOCKED socket\n"); return 0; }
              struct sockaddr_in a;
              memset(&a, 0, sizeof a);
              a.sin_family = AF_INET;
              a.sin_port = htons(80);
              a.sin_addr.s_addr = inet_addr("1.1.1.1");
              if (connect(fd, (struct sockaddr *)&a, sizeof a) != 0) {
                  printf("BLOCKED connect\n");
                  return 0;
              }
              printf("CONNECTED\n");
              return 0;
          }
          EOF
          cc -O2 -o /tmp/netprobe /tmp/netprobe.c

          echo -n "without the shim: "; /tmp/netprobe
          if [ "${{ runner.os }}" = "macOS" ]; then
            preload_var=DYLD_INSERT_LIBRARIES
          else
            preload_var=LD_PRELOAD
          fi
          echo -n "with the shim:    "
          out=$(env "$preload_var=$PWD/executor/${{ matrix.lib }}" /tmp/netprobe)
          echo "$out"
          case "$out" in
            *BLOCKED*) ;;
            *) echo "::error::${{ matrix.lib }} did not block the connection (got: $out)"; exit 1 ;;
          esac
          case "$out" in
            UNIX_OK*) echo "ok: ${{ matrix.lib }} blocked the network and left AF_UNIX alone" ;;
            *) echo "::error::${{ matrix.lib }} blocked AF_UNIX; --no-net must block the NETWORK, not every socket (got: $out)"; exit 1 ;;
          esac
