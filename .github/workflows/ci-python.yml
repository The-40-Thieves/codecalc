name: ci-python

# Lint + the parts of the test suite that can run anywhere.
#
# What CANNOT run here, stated explicitly so nobody mistakes this for full coverage:
# tests/test_smoke.py exercises all 31 runtimes and needs mise, rustup, swiftly, nix and a dozen apt
# toolchains. A hosted runner has a handful of them, so the job would be red for reasons that have
# nothing to do with the PR. The `sandbox` job below covers the python3 path — which is the one every
# security assertion in AUDIT.md is written against — and ci-rust.yml covers the executor binary's
# contract directly.
#
# tests/test_hybrid.py is excluded for the same reason: it smoke-tests ten compiled and interpreted
# runtimes (go, rust, java, swift, zig, elixir among them) that a hosted runner does not carry. This
# line exists because its absence was NOT written down anywhere, while test_smoke.py's was — and an
# undocumented exclusion is indistinguishable from an oversight. It also could not have failed a
# build until THE-776: it printed `FAIL <lang>` and exited 0 regardless, with no accumulation
# anywhere in the file. scripts/check_claims.py now asserts every suite can fail.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint, zero residual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
      # The ruleset and every exception live in pyproject.toml with a written reason each. The
      # residual on codecalc/ and tests/ is a genuine 0, so this GATES: any new finding is red.
      - name: ruff check
        run: uvx --from 'ruff==0.16.1' ruff check codecalc/ tests/ scripts/
      # A `ruff check` over a path that matches nothing exits 0, which is indistinguishable from a
      # clean tree — the same shape as every other source-scan gate in this repo. Assert the file
      # count so a package rename fails the job rather than silently disabling it.
      - name: floor — the linter actually saw the package
        run: |
          set -euo pipefail
          n=$(find codecalc tests scripts -name '*.py' | wc -l)
          echo "python files linted: $n"
          [ "$n" -ge 20 ] || { echo "::error::only $n python files found; the lint path is wrong."; exit 1; }

  tests:
    # OS matrix, not just a Python-version matrix. Everything in this job is pure
    # logic over dicts and paths, so it should behave identically everywhere —
    # which is exactly why running it on Windows is worth doing: `codecalc`
    # previously failed at IMPORT there, because executor.py did an unconditional
    # `import resource` and that module does not exist on Windows.
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the floor declared in pyproject (requires-python); 3.14 is what the dev box runs.
        # Both ends matter — the codebase uses `X | None` unions and tomllib, which bound it below.
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: ${{ matrix.python }}
      # --locked, NOT --frozen. Both install exactly what uv.lock pins — which is the point, so a
      # CI run cannot silently upgrade the MCP SDK — but `--frozen` never checks that the lock still
      # DESCRIBES pyproject.toml, so a stale lock is used in silence.
      #
      # That is not hypothetical. The lock kept sympy, z3 and tree-sitter as CORE dependencies for
      # the entire life of the #94 extras split: every job here installed a dependency set
      # pyproject.toml does not describe, and `uv lock --check` had been failing the whole time with
      # nothing asking it. `--locked` asserts the lock is current and fails if it is not.
      #
      # Found on a contributor's machine rather than here, and the asymmetry is the reason: plain
      # `uv sync` re-resolves and produces the CORRECT base install, so a contributor and CI were
      # running different environments. The suite then crashed there on an unguarded sympy import
      # that CI's accidentally-fatter environment always satisfied.
      #
      # --all-extras because these suites genuinely need sympy and tree-sitter. The BASE install is
      # tested separately below with `uv pip install .`, which resolves from pyproject rather than
      # the lock — that step is what proves the extras are actually optional.
      - name: install (locked, with extras)
        run: uv sync --locked --all-extras
      # ── tree-sitter grammars are DOWNLOADED, not bundled (THE-820) ──────────────────────────────
      #
      # `tree-sitter-language-pack` ships a ~4.7 MB native extension and fetches each grammar on
      # FIRST USE into a versioned on-disk cache. Measured: a cold cache pulls 28 grammars / 89 MB
      # in ~14s, and deleting one grammar and asking for it again brings it back byte-for-byte.
      #
      # That is a per-language network call in the middle of a test suite, and it failed exactly
      # the way that implies: ONE language missing while the other 31 worked, intermittently, on CI
      # but never locally — because a dev box has a warm cache and every runner starts cold. It
      # surfaced as five scattered assertion failures about loop counting, with nothing anywhere
      # saying "a download failed", because `analyze_complexity` degrades to its regex fallback
      # rather than erroring.
      #
      # Two steps fix that, and they do different jobs:
      #   the cache  removes the network from the steady-state path entirely
      #   the prefetch  makes a cold-cache fetch failure a named step failure with the real
      #                 exception, instead of assertions failing later for an unrelated-looking reason
      #
      # Keyed on uv.lock: the cache path is version-scoped (.../v1.14.3/libs), so a pack bump both
      # changes the key and writes to a new directory. Nothing to invalidate by hand.
      - name: resolve the grammar cache directory
        id: grammar-cache
        shell: bash
        # The pack decides this per-OS (platformdirs), so it is ASKED rather than assumed — a
        # hardcoded ~/.cache path would silently cache nothing on macOS and Windows, which is the
        # failure mode where the cache step looks green and does not work.
        run: echo "dir=$(uv run --no-sync python scripts/prefetch_grammars.py --print-cache-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.grammar-cache.outputs.dir }}
          key: tslp-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: prefetch grammars
        shell: bash
        # Retries live inside the script (3 attempts, backoff) because a single attempt measures
        # the network rather than the grammar. A failure here names the grammar AND the exception,
        # which `_grammar_available` used to swallow entirely.
        run: uv run --no-sync python scripts/prefetch_grammars.py
      # Pure-python parity suite: 19 ported calc features against known-good values. No sandbox, no
      # runtimes, no network — it should pass identically everywhere, which is exactly why it is the
      # cheapest signal that the arithmetic core did not regress.
      - name: import codecalc at all
        shell: bash
        # The cheapest possible Windows regression test. Before the platform
        # split this raised ModuleNotFoundError: no module named 'resource'.
        run: uv run --no-sync python -c "import codecalc, codecalc.executor, codecalc.sessions, codecalc.server; print('import ok on', __import__('sys').platform)"
      # THE-780: doctor is the documented install-verification step, so it has to
      # work on every OS a user installs on — and its exit code is load-bearing
      # (0 = can execute, 1 = cannot), which means a Dockerfile or provisioning
      # script depends on it being right here. This job has no built binary and
      # a partial set of runtimes, which is precisely the degraded shape doctor
      # exists to describe: it must still exit 0, because a fallback backend and
      # missing runtimes are facts about a host, not a broken install.
      - name: doctor runs, and its exit code means what it says
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m codecalc doctor
          # --json must emit JSON and nothing else; a diagnostic whose
          # machine-readable mode also prints a banner cannot be piped.
          uv run --no-sync python -m codecalc doctor --json > doctor.json
          uv run --no-sync python -c "
          import json, sys
          d = json.load(open('doctor.json'))
          print('backend:', d['backend']['kind'], '| basis:', d['status_basis'],
                '| runtimes:', d['runtime_summary'])
          assert d['healthy'] is True, d
          assert d['status_basis'] == 'resolved', d['status_basis']
          assert not any(r['status'] == 'available' for r in d['runtimes']), \
              'nothing was executed, so nothing may claim to be available'
          "
      # Pure launch-contract tests run on every client OS. They do not require
      # Docker: an injected command runner proves the argv, fail-closed probe,
      # ownership checks, and gvisor-v1 receipt are platform-neutral.
      - name: strict provider and gVisor launch contract
        shell: bash
        run: |
          uv run --no-sync python tests/test_strict_providers.py
          uv run --no-sync python tests/test_gvisor_runtime.py
      # The provider boundary and the execution service. Neither ran in CI at
      # all before this — seven suites do not, and these two are where the
      # ComputationSpec identity (THE-793) and the execution receipt (THE-782)
      # are asserted, so every claim they make was verified on one developer's
      # Linux box and nowhere else. A test that never runs is a comment.
      #
      # Pure, so they belong on the matrix rather than in `sandbox`: an injected
      # provider, a RecordingMCPServer stub for the serve-http checks (nothing
      # binds a socket), a temp-dir workspace, and python3 for the conformance
      # run. Sessions are already exercised here by test_session_jail.py and
      # test_contract.py, so the Windows leg is not new ground.
      #
      # Running them on all three OSes is the point for THE-793 specifically:
      # the golden vectors claim the canonical bytes are identical everywhere,
      # and a Linux-only run cannot make that claim.
      - name: provider boundary and execution service (spec identity + receipt)
        shell: bash
        run: |
          uv run --no-sync python tests/test_providers.py
          uv run --no-sync python tests/test_execution_service.py
      - name: calc parity
        shell: bash
        run: uv run --no-sync python tests/test_calc_port.py
      # The translate/optimize correctness gate. Also pure: classify_case and aggregate take
      # executor result dicts, so the decision logic runs here without a sandbox or two runtimes.
      # That split is why this suite exists at all — the old logic could only be reached by actually
      # running two programs, so the trust boundary of translate_code was never tested anywhere.
      - name: translation verification gate
        shell: bash
        run: uv run --no-sync python tests/test_translation_verify.py
      # THE-785: the grade vocabulary (cross_checked / solver_proven / ungraded,
      # plus the reserved executed) derived from evidence verify_translation,
      # verify_optimization and z3_check already emit. Mostly pure — fixtures are
      # hand-built evidence dicts, same reasoning as the translation verification
      # gate above — with a handful of real z3_check calls at the end to prove the
      # engine/timeout_ms evidence actually flows through. Needs the sympy/z3
      # extras this job's `--all-extras` install already provides.
      - name: grade vocabulary derivation rules
        shell: bash
        run: uv run --no-sync python tests/test_grades.py
      # Session workspace confinement. Also sandbox-free: _jail() is path logic over a tempdir, so
      # the boundary can be checked on any runner rather than only where a session can be started.
      # The protocol gate. Asserts the NEGOTIATED version from a real connection,
      # not `mcp.types.LATEST_PROTOCOL_VERSION` — that constant reads
      # "2026-07-28" even on a connection that negotiated 2025-11-25, so reading
      # it would be a version string mistaken for a running protocol.
      - name: MCP protocol conformance (2026-07-28)
        shell: bash
        run: uv run --no-sync python tests/test_mcp_protocol.py
      # The result contract, validated rather than described. scripts/check_contract.py (in
      # ci-security) proves the published schema matches the module that generates it; this proves
      # the schema is a loadable JSON Schema 2020-12 document and that real results — every verdict,
      # every error code, both backends, and the serialised responses over stdio — satisfy it.
      # Needs jsonschema, which arrives transitively with mcp, so it belongs here and not in a gate
      # that has to run on a bare checkout. Runs on the full OS matrix because the contract's central
      # claim is that the two backends agree, and the fallback is what Windows and unbuilt hosts get.
      - name: result contract (schema validity + product conformance)
        shell: bash
        run: uv run --no-sync python tests/test_contract.py
      # The run-lifecycle state machine (THE-778/THE-831): identity, cancel,
      # cleanup and crash-recovery journalling, all against fake providers —
      # no sandbox, no native executor, so it belongs on the full matrix
      # alongside the other protocol-neutral suites rather than in `sandbox`.
      - name: run supervisor lifecycle
        shell: bash
        run: uv run --no-sync python tests/test_run_supervisor.py
      # doctor in the environments it exists to diagnose: no native executor, no
      # runtimes, a resolved-but-unrunnable command, an unwritable workspace. A
      # diagnostic is only worth having if it is right about a BROKEN host, and a
      # green runner exercises none of those.
      - name: doctor diagnostics (degraded environments)
        shell: bash
        run: uv run --no-sync python tests/test_doctor.py
      # tree-sitter vs the regex heuristic it replaced. Pure: parsing only, no
      # sandbox, so it runs on all three OSes — which also proves the
      # pre-compiled grammar wheels resolve on each of them.
      - name: tree-sitter analyser (differential vs regex)
        shell: bash
        run: uv run --no-sync python tests/test_parsing_vs_regex.py
      # install_package must not write outside the workspace. Static assertions on
      # the installer table: a test that actually installed something would need
      # the network and would, on regression, do the damage it checks for.
      - name: package install isolation
        shell: bash
        run: uv run --no-sync python tests/test_package_isolation.py
      # THE-791: CODECALC_PACKAGE_ALLOWLIST is unset by default (no behaviour
      # change) but deny-by-default once configured, with subprocess.run
      # stubbed so a denial is asserted PRE-side-effect rather than trusted
      # from the return value alone.
      - name: package install allowlist (deny-by-default)
        shell: bash
        run: uv run --no-sync python tests/test_package_allowlist.py
      # THE-787: the capability broker (approved never exceeds requested),
      # deny-by-default network as a policy option, and the append-only audit
      # stream. All three run against synthetic providers / injected clocks —
      # no sandbox, no native executor — so they belong on the full OS matrix
      # alongside the other protocol-neutral policy suites. The network-policy
      # suite deliberately covers BOTH a network-controlling provider and one
      # that cannot enforce no_net, so the python-fallback matrix job exercises
      # the fail-open-but-disclosed branch the native backend never takes.
      - name: capability broker, network policy, and audit stream (THE-787)
        shell: bash
        run: |
          uv run --no-sync python tests/test_capability_broker.py
          uv run --no-sync python tests/test_network_policy.py
          uv run --no-sync python tests/test_audit_log.py
      # Regressions from the 2026-08-08 bug sweep: lost exactness, wrong widths,
      # crashes on ordinary inputs, a dead ns path, and documented constant
      # names that resolved to nothing.
      - name: bug-sweep regressions
        shell: bash
        run: uv run --no-sync python tests/test_bug_sweep.py
      - name: session jail
        shell: bash
        # Path confinement is where platforms differ most: Windows has drive
        # letters, case-insensitive paths and a different separator, and the
        # boundary check must hold under all of them.
        run: uv run --no-sync python tests/test_session_jail.py
      # tests/test_execution_service.py already runs above ("provider boundary
      # and execution service (spec identity + receipt)") — that step now also
      # covers run_submit/run_inspect/run_cancel (THE-778, fake providers, no
      # sandbox) and session output spill (THE-783, real bash sessions), added
      # to the same file rather than wired a second time here.
      # The sweeps below were written on Linux and gated only there. Both carry
      # POSIX-only sections that skip themselves, and both are the kind of thing
      # a platform difference breaks quietly — session workers, file
      # descriptors, subprocess semantics — so they run on all three.
      - name: session + worker regressions
        run: uv run --no-sync python tests/test_python_sweep.py
      # THE-779: CODECALC_SESSION_IDLE_TTL_SECONDS is unset by default (no
      # expiry, ever) but reaps an idle worker on next access once
      # configured. Covers both worker languages and asserts on the OS-level
      # PID, not just the in-memory bookkeeping — same platform reasoning as
      # the sweep above.
      - name: session idle-expiry
        run: uv run --no-sync python tests/test_session_idle_expiry.py
      # No network needed and none permitted: this asserts the package cannot
      # make an outbound request at all, so it cannot flake on connectivity.
      - name: offline guarantee (no network calls anywhere)
        run: uv run --no-sync python tests/test_offline.py
      # Pure Python and no toolchain needed, so it belongs on the matrix rather
      # than in the sandbox job.
      - name: absent-input regressions
        run: uv run --no-sync python tests/test_absent_input_sweep.py

      # ── the BASE install, without the extras (#88) ───────────────────────
      #
      # sympy, z3 and tree-sitter are optional now. That is only true if
      # something checks it: every other step here runs against `uv sync
      # --frozen`, which installs everything, so a module-scope import of sympy
      # added later would pass all of them and break the base install for
      # everyone who did not ask for the symbolic extra.
      #
      # A separate venv rather than a separate job: the point is one install
      # without the extras, and a job would repeat the whole matrix to get it.
      - name: base install (no extras) still starts and degrades honestly
        shell: bash
        run: |
          set -euo pipefail
          uv venv /tmp/base-venv
          # Windows venvs put the interpreter in Scripts/python.exe, not
          # bin/python. Hardcoding the POSIX layout failed both Windows legs
          # with "No virtual environment ... found for path .../bin/python" —
          # the venv was fine, the path was not.
          BASE_PY=/tmp/base-venv/bin/python
          [ -x "$BASE_PY" ] || BASE_PY=/tmp/base-venv/Scripts/python.exe
          echo "base interpreter: $BASE_PY"
          uv pip install --python "$BASE_PY" .
          # The server must IMPORT. This is the regression that would hurt
          # most: an import error here is a server that will not start at all.
          "$BASE_PY" -c "import codecalc.server; print('import ok')"
          "$BASE_PY" -m codecalc doctor
          # And the symbolic tools must return the documented shape rather than
          # raising — an ImportError escaping a tool tells a caller the server
          # is broken when they simply installed the small variant.
          "$BASE_PY" - <<'PY'
          from codecalc import logic
          r = logic.evaluate_expression("2+2")
          assert r.get("ok") is False, r
          assert "symbolic" in (r.get("error") or ""), r
          assert "pip install" in (r.get("error") or ""), r
          print("degrades honestly:", r["error"][:80])
          PY

      # ── the FALLBACK backend, on purpose (#66) ───────────────────────────
      #
      # This job never builds the executor and `bin/` is gitignored, so every
      # step above has always run on the pure-Python fallback. That was true by
      # accident rather than by assertion: nothing here checked it, so if a
      # binary ever appeared — committed, vendored, or shipped in a wheel — the
      # whole matrix would silently switch backends and the fallback would go
      # untested with every check still green.
      #
      # The sandbox job asserts `backend == "rust"` for exactly this reason.
      # This is the mirror of that floor, and it is what makes the two steps
      # below mean what they say.
      - name: floor — the FALLBACK is the backend under test
        shell: bash
        run: |
          set -euo pipefail
          backend=$(uv run --no-sync python -c 'from codecalc import executor; print(executor.backend())')
          echo "backend: $backend"
          [ "$backend" = "python" ] || { echo "::error::backend is '$backend', expected 'python' — this job is the fallback's only coverage."; exit 1; }

      # The fallback's honesty contract: what it cannot enforce must be NAMED
      # in `unenforced`, and what it does not name must actually bite. This
      # file used to skip its entire body without a native executor and exit 0,
      # so on this job it was a green check covering nothing.
      - name: platform contract (fallback tells the truth)
        run: uv run --no-sync python tests/test_platform_contract.py

      # LAST IN THE JOB. The fork-bomb assertions drive the machine's process
      # count to the ceiling, so anything that needs to spawn must already have
      # run — the same ordering rule the sandbox job states, for the same
      # reason. Do not move a new step below this one.
      #
      # ALL THREE PLATFORMS. This was Linux-only, because running it on the
      # full matrix surfaced two failures that were the fallback's and not the
      # test's — #75. Both are fixed, so the guard comes off with them:
      #
      #   windows  the assertion read os.environ['HOME'], which Windows does
      #            not have. _ENV_ALLOWLIST carries USERPROFILE and calls it
      #            "the Windows spelling of HOME" in its own comment, so the
      #            check now accepts either name. The property is the same
      #            everywhere; only the spelling was Unix-specific.
      #   macos    the fork probe reported "None children" — no reading taken —
      #            through an assertion that could only say "the limit did not
      #            bound the bomb". Those are now separate outcomes.
      #
      # Windows still self-skips the fork probe (os.fork does not exist there)
      # and covers the ceiling with the portable spawn probe instead.
      - name: security regressions (on the fallback)
        run: uv run --no-sync python tests/test_security.py

  sandbox:
    # The security suite. Split out from `tests` because it needs the Rust binary built first, and
    # because its assertions are the ones AUDIT.md's verdict rests on.
    #
    # POSIX only, and deliberately so: the suite's fork-bomb assertions call
    # os.fork(), which does not exist on Windows. Rather than skip half the file
    # there and call the result a pass, Windows sandbox coverage comes from
    # ci-rust's `executor contract` job, which exercises the Job Object path
    # against the real binary.
    name: sandbox + security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows was absent, so the platform whose sandbox is built on a
        # completely different primitive — job objects rather than rlimits —
        # was the one never exercised. The shim build step below is skipped
        # there because Windows has no LD_PRELOAD equivalent; the executor
        # reports `no_net_unavailable_on_windows` and the contract test asserts
        # that it does.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: executor
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          python-version: '3.12'
      - name: install (locked)
        run: uv sync --locked --all-extras
      # codecalc/executor.py picks the binary out of bin/ by architecture. Build it into place so
      # the suite exercises the RUST path — the production one. Without this step every executor
      # assertion below would silently run against the pure-Python fallback instead, testing the
      # code path that only runs when the binary is missing.
      - name: build the executor into bin/
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path executor/Cargo.toml
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp executor/target/release/codecalc-exec.exe bin/
          else
            cp executor/target/release/codecalc-exec bin/
          fi
          # cc, not gcc: on macOS runners gcc is a clang shim and the shim name
          # differs by platform (see platform::no_net_shim). Windows has no
          # LD_PRELOAD equivalent at all, so there is nothing to build — the
          # executor reports --no-net as unenforced there instead of pretending.
          if [ "${{ runner.os }}" = "macOS" ]; then
            cc -shared -fPIC -O2 -o bin/blocknet.dylib executor/blocknet.c
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "windows: no shim to build (--no-net is reported unenforced)"
          else
            cc -shared -fPIC -O2 -o bin/blocknet.so executor/blocknet.c
          fi
      - name: assert the RUST backend is the one under test
        shell: bash
        run: |
          set -euo pipefail
          backend=$(uv run --no-sync python -c 'from codecalc import executor; print(executor.backend())')
          echo "backend: $backend"
          [ "$backend" = "rust" ] || { echo "::error::backend is '$backend', expected 'rust' — the suite would be testing the fallback."; exit 1; }
      # The MCP surface is how every consumer reaches this code. A tool that raises on import, or a
      # schema the SDK rejects, is invisible to every test above — they all call the functions
      # directly. This spawns the real server over stdio and round-trips it.
      # These need the built binary, which is why they live here rather than in
      # the matrix job above. Neither ran in CI before: together they are the
      # sandbox's own regression suite and its cross-platform contract, and they
      # were gated on one developer's machine.
      - name: executor regressions
        run: uv run --no-sync python tests/test_executor_sweep.py
      # Asserts that every ceiling NOT named in `unenforced` actually bites on
      # THIS platform — the half of the promise that cannot be checked by
      # reading the code, because a limit that is set but ignored looks exactly
      # like one that is enforced until something exceeds it.
      - name: platform contract (unenforced tells the truth)
        run: uv run --no-sync python tests/test_platform_contract.py
      - name: runtime self-update tools
        run: uv run --no-sync python tests/test_runtimes_mcp.py
      - name: MCP stdio round-trip
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python tests/test_mcp_all.py | tee /tmp/mcp.out

          # FLOOR on the TOOL SURFACE, not on the absence of the word "error" in the output.
          # tests/test_mcp_all.py now asserts this itself, and asserts the ANSWERS its tools give
          # rather than only printing them — it used to have no assertions at all, so "it exited 0"
          # meant the transport worked and nothing more. This step is kept as the outer check: it
          # derives the declared side from server.py independently of the test, so a test that
          # stops running, stops printing, or is deleted still fails the build rather than passing
          # vacuously.
          #
          # This used to compare COUNTS, and its comment named a failure mode that MCP SDK 2.0.0
          # does not have. Both are fixed in scripts/check_tool_names.py: it compares NAME SETS
          # (a count passes when one tool is lost and another gained — THE-811), and it asserts
          # against the silent path that actually exists, a duplicate name that add_tool discards
          # with a warning nothing reads, rather than a schema failure, which RAISES (THE-810).
          uv run --no-sync python scripts/check_tool_names.py /tmp/mcp.out
      # LAST STEP IN THE JOB, deliberately. The fork-bomb assertions are the only
      # destructive thing here: they drive the process count to the limit, and on
      # a 3-core macOS runner the reaping is slow enough that the NEXT step's
      # shell could not fork — the suite printed ALL TESTS PASS and the job died
      # at `fork: Resource temporarily unavailable` in the step after it.
      #
      # The same principle as the test file's internal ordering, applied one
      # level up: whatever exhausts a shared resource goes last. Do not move a
      # new step below this one.
      - name: security regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python tests/test_security.py | tee /tmp/sec.out

          # Count with BASH BUILTINS ONLY — no grep, no sleep, no subshell.
          #
          # The fork-bomb assertions drive the process count to the limit, and on
          # a 3-core macOS runner the kernel has not finished reaping by the time
          # this runs. Every external command here needs a fork, so `grep -c`
          # failed with "fork: Resource temporarily unavailable" AFTER the suite
          # had printed ALL SECURITY TESTS PASS. Adding `sleep 5` did not help:
          # sleep is itself an external binary and could not fork either.
          #
          # `while read` and `case` are builtins, so this needs no process at all
          # and cannot be starved by the thing it is measuring.
          passed=0
          while IFS= read -r line; do
            case "$line" in PASS*) passed=$((passed + 1)) ;; esac
          done < /tmp/sec.out
          echo "security assertions passed: $passed"

          # 13 on macOS, 14 on Linux: the tight fork-bomb headroom assertion only
          # applies where the ambient task count is measurable, and the suite
          # prints SKIP with the reason otherwise. Flooring at 13 keeps the guard
          # against silent shrinkage without asserting a Linux-only count.
          if [ "$passed" -lt 13 ]; then
            echo "::error::only $passed security assertions ran (expected >= 13). Assertions were removed or the suite aborted early."
            exit 1
          fi
