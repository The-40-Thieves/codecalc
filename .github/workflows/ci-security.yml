name: ci-security

# codecalc is a remote code execution service by design — running untrusted code in 31 languages is
# its product, which puts it in the highest-risk category of software there is. AUDIT.md found and
# fixed 2 critical and 3 high vulnerabilities before the first commit. This workflow is what stops
# them coming back, and it splits into two kinds of job:
#
#   STRUCTURAL gates (parity / no-eval / claims) GATE. They are static assertions about files in the
#   repo with no external feed, so they cannot start failing overnight for reasons outside a PR.
#
#   ADVISORY scans (cargo-audit, osv-scanner) are continue-on-error. A transitive CVE disclosed on a
#   Tuesday should surface, not wall off an unrelated feature PR. gitleaks is the exception: a
#   committed secret must block, and pattern matching does not depend on anyone else's uptime.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly: catch newly disclosed advisories against a static tree
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-eval:
    # AUDIT.md CRITICAL-01. `truth_table()` used eval() with a restricted globals dict, which is not
    # a sandbox: `().__class__.__base__.__subclasses__()` reaches subprocess.Popen and executes
    # commands in the MCP server process — the process holding every API key.
    #
    # This runs SEPARATELY from tests/test_security.py, which also checks it. That suite needs a
    # built binary and a working sandbox, so it cannot run on a bare checkout; a security invariant
    # that only holds where the toolchain is installed is not an invariant. This needs nothing but
    # a Python interpreter.
    name: zero eval/exec (the CRITICAL-01 invariant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_no_eval.py

  tool-dispatch:
    # TOOL_TIMEOUTS is keyed on the INBOUND tools/call name, so the per-tool deadlines are only
    # correct while the tool a client asks for is the tool that runs. A dispatcher would make the
    # middleware see the outer name and drop all twelve deadlines to the 900s default, silently.
    # Kept as its own job rather than another step in zero-eval so a red square names the invariant
    # that actually broke: a tool dispatch is not a dynamic-execution construct, and a gate that
    # reports the wrong cause is one the next reader reasons about wrongly.
    name: tool dispatch (the TOOL_TIMEOUTS precondition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_tool_dispatch.py

  contract:
    # docs/contract/result-v1.schema.json is generated from codecalc/contract.py and is what a
    # client programs against. A generated document nobody regenerates drifts, and this one drifts
    # worse than prose: a stale schema makes a strictly-validating client REJECT results that are
    # correct. This job also re-derives both backends' verdict vocabularies from main.rs and
    # executor.py, which is the check parity cannot make — check_parity.py diffs the two backends'
    # KEY sets and is blind to a new verdict value that would be missing from the published enum.
    # Its own job for the same reason as the one above: a red square should name the invariant.
    name: published contract matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # No `pip install`: this gate is stdlib-only on purpose, so a bare checkout proves the
      # invariant. If it ever needs a dependency, that is the signal it belongs in the test suite.
      - run: python scripts/check_contract.py

  version:
    # pyproject.toml, executor/Cargo.toml and CHANGELOG.md each declare a version, edited by hand.
    # release.yml publishes the wheel and the crate from ONE dispatch precisely so the two
    # registries cannot carry different code under the same version — two numbers defeat that at the
    # one point it cannot be undone, since a version uploaded to PyPI is burned even if deleted.
    # On a tag push this also compares GITHUB_REF, which is the moment the number becomes permanent.
    name: one version, everywhere it is declared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_version.py

  parity:
    # codecalc keeps the SAME three security-critical constants in two languages: the env allowlist
    # (the CRITICAL-02 fix), RUNTIME_PATH, and the language registry. Nothing links the Rust copy to
    # the Python one. Add a variable to the Rust allowlist alone and the Python fallback keeps
    # leaking it — on precisely the machines where the binary was never built, which is where the
    # fallback runs.
    name: python/rust constant parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_parity.py

  runtime-tiers:
    # THE-895. `list_languages`/`doctor` present every resolved runtime as equally
    # operational, but resolution ("its command is on PATH") is not reliability
    # ("codecalc's CI actually ran it") — a review's own smoke test found the rust
    # and csharp HOST toolchains failing on a machine where both commands resolved
    # cleanly. registry.RELIABILITY_TIERS makes that claim explicit per language;
    # this gate keeps the `tested` tier honest by deriving it from the literal
    # source of the two files that actually wire a language into CI, rather than
    # trusting a hand-maintained list that could drift from what CI runs.
    name: runtime reliability tiers match what CI actually exercises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_runtime_tiers.py

  claims:
    # The README's headline numbers are counts, and counts rot. The first commit shipped README,
    # AUDIT.md and the registry claiming 31, 33 and 32 languages, and a Cargo.toml declaring MIT
    # against an Apache-2.0 LICENSE — all simultaneously, all reviewed.
    name: README claims match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_claims.py

  description:
    # The GitHub repo description is the most-read text in the project — every search result, every
    # og:image — and the one surface no file in this tree can see. It read "48 MCP tools" for a day
    # after the count became 47, because check_claims.py only ever reached the README. A gate that
    # covers one surface does not make a claim true; it decides which surface rots.
    #
    # NOT run on pull_request, deliberately. The header above commits the structural gates to being
    # static assertions with no external feed, so they cannot start failing overnight for reasons
    # outside a PR. A repo description is exactly such a feed: anyone can edit it in the UI, and a
    # gating PR job would then block unrelated work for a change nobody in that PR made. On push and
    # on the weekly cron it catches the drift where the drift actually happens.
    name: repo description matches the code
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: compare the description to server.py
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desc=$(gh repo view "$GITHUB_REPOSITORY" --json description -q .description)
          # An empty description makes every count pattern match nothing. check_claims.py's FLOOR
          # already reports that as a failure rather than a pass, but say which of the two happened
          # here so the log does not read as a count mismatch.
          if [ -z "$desc" ]; then
            echo "the repo description is empty — nothing to check, which is itself the finding"
            exit 1
          fi
          python scripts/check_claims.py --description "$desc"

  portability:
    # The repo is PUBLIC and the executor binary ships. It was written against one machine and it
    # showed: RUNTIME_PATH hardcoded a home directory in BOTH backends, llm.py defaulted to a private
    # tailnet address, complexity.py carried a SECOND copy of that address, and five test files
    # hardcoded an absolute checkout path. None of it is wrong as Python or Rust — it is only wrong
    # as a published artifact, which is why no linter flagged any of it.
    name: no machine-specific paths or private addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_portability.py

  actionlint:
    # Expression-level type and ARITY checking plus shellcheck over every embedded `run:` block
    # (ubuntu-latest ships shellcheck). This workflow set is heavy on inline bash, and a `set -euo
    # pipefail` script with a subtle quoting bug fails open — it is the failure mode where a gate
    # reports success having skipped its own check.
    #
    # GATES: static analysis of files in this repo, no external feed.
    name: actionlint (workflow lint + shell + expressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install actionlint v1.7.12 (pinned binary + checksum)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint -color

  gitleaks:
    # GATES. A committed credential must block the PR, and pattern matching needs no network, so
    # this is the fail-CLOSED half of the secret-scanning pair (trufflehog below is fail-open by
    # construction). Scans the working tree rather than history: the question on a PR is what
    # SHIPS, and this repo has one commit anyway.
    name: gitleaks (committed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks
        # Image pinned to an immutable digest, not :latest. Refresh with
        # `docker manifest inspect ghcr.io/gitleaks/gitleaks:latest | grep -m1 digest`.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --no-git --source /repo --no-banner --redact --exit-code 1

  trufflehog:
    # Complements gitleaks rather than duplicating it: gitleaks asks "does this look like a
    # credential" from patterns; trufflehog --only-verified asks "is this credential LIVE" by
    # calling the issuing provider.
    #
    # HONEST LIMITATION: verification is a network call, so this FAILS OPEN. If a provider endpoint
    # is unreachable a live credential degrades to "unverified" and this job stays green. That is
    # the deliberate trade — a gate that fails closed on someone else's outage trains people to
    # ignore it. gitleaks above is the fail-closed half and runs on every PR regardless.
    #
    # --no-update: the binary is checksum-pinned; letting it self-update at runtime would replace
    #   the thing that was verified.
    # --fail: trufflehog exits 0 WITH FINDINGS unless this is passed.
    # --fail-on-scan-errors: a scan that errors part-way otherwise prints "0 verified", which is
    #   byte-identical to a clean repo.
    # --exclude-detectors=Lob: a false-positive CLASS, not a risk acceptance. A Lob key is `test_`
    #   plus 35 characters with no required keyword nearby, which is byte-for-byte the shape of a
    #   pytest function name exactly 40 characters long — `test_config_requires_digest_pinned_image`
    #   is one. Worse, Lob answers 200 to any `test_`-prefixed value, so --only-verified, the flag
    #   whose entire job is suppressing false positives, is what PROMOTES these to "verified live
    #   secret". Measured on this tree with a .venv present: 85 findings, 100% Lob, 100% 40-character
    #   test names out of sympy and jsonschema. codecalc has no Lob dependency and no reason to grow
    #   one (`rg -i '\blob\b'` over the tree is empty). This cannot fail open the way a path or
    #   keyword exclusion could: an unrecognised detector name ABORTS the scan with "unrecognized
    #   detector type" and exit 1, so a typo here turns the job red rather than blind — checked
    #   against v3.96.0, not assumed. gitleaks above is untouched and stays the fail-closed half.
    name: trufflehog (verified live secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install trufflehog v3.96.0 (pinned binary + checksum)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/th-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/th.tar.gz" \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz
          echo "7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  $RUNNER_TEMP/th.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/th.tar.gz" -C "$RUNNER_TEMP/th-bin" trufflehog
          echo "$RUNNER_TEMP/th-bin" >> "$GITHUB_PATH"
      - name: trufflehog
        run: trufflehog filesystem . --only-verified --no-update --fail --fail-on-scan-errors --exclude-detectors=Lob

  osv-scanner:
    # Cross-ecosystem dependency scan over EVERY lockfile in the tree.
    #
    # This job is the reason uv.lock is committed. Before it existed, osv-scanner found exactly one
    # lockfile — executor/Cargo.lock, 13 crates — and reported "No issues found". The Python side
    # (fastmcp, sympy, z3-solver and 75 transitive packages) was not scanned at all, and a scan that
    # covers 13 of 91 packages produces output indistinguishable from a clean one. With the lockfile
    # committed the same command reports 91 packages across 2 ecosystems.
    #
    # continue-on-error: a newly disclosed transitive advisory should surface, not block an
    # unrelated PR.
    name: osv-scanner (every lockfile)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install osv-scanner v2.4.0 (pinned binary + checksum)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/osv-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/osv-bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $RUNNER_TEMP/osv-bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-bin/osv-scanner"
          echo "$RUNNER_TEMP/osv-bin" >> "$GITHUB_PATH"
      - name: osv-scanner
        # FLOORED. `osv-scanner` over a tree with no lockfiles prints "No issues found" and exits 0
        # — the exact output of a clean scan. Assert both lockfiles are present first, so deleting
        # or renaming one fails the job instead of silently shrinking its coverage to nothing.
        run: |
          set -euo pipefail
          for f in uv.lock executor/Cargo.lock; do
            [ -f "$f" ] || { echo "::error::$f is missing — osv-scanner would report a clean tree it never scanned."; exit 1; }
          done
          osv-scanner scan source --recursive .

  cargo-deny:
    # Licence, ban and registry-source policy for the executor's dependency graph. The crate
    # compiles into a binary this project DISTRIBUTES (the static musl artifacts), so a copyleft
    # dependency arriving transitively would be a real distribution problem found at the worst
    # possible moment. cargo-audit answers a different question and says nothing about licences.
    #
    # GATES, unlike cargo-audit below: executor/deny.toml is a static assertion about the graph, so
    # it cannot start failing overnight the way an advisory feed can. Its own [advisories] section
    # is left non-fatal so the two jobs do not both hard-fail on the same disclosure.
    name: cargo-deny (licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        working-directory: executor
        run: cargo deny check

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: executor
        run: cargo audit

  opengrep-baseline:
    # The SAST baseline used to live in a comment right here, listing 5 accepted findings in
    # llm.py / context7.py / complexity.py / _worker_bootstrap.py. Two of those files were then
    # DELETED with the LLM and context7 removal, so four of five entries named files that did not
    # exist — while the real scan had dropped to 2 findings, one of them new and undocumented. Read
    # against a baseline of 5, "2 findings" looks like improvement. It was not; it was four findings
    # leaving with their files and a fresh one arriving unnoticed.
    #
    # A comment cannot be wrong out loud. scripts/check_opengrep_baseline.py now holds the baseline
    # as data and asserts every entry names a file that exists and carries a reason. This is the
    # second time a justification in this repo outlived its files (the first was the S310 ruff
    # exemption, #100), and check_no_eval.py already floors on exactly this for its exec() exception.
    #
    # GATES, and runs on every PR, because it is a static assertion about files in this repo with no
    # external feed — the same test the header applies to parity/no-eval/claims. It needs no opengrep
    # and no network, so a file deletion is caught in the PR that deletes it, not a month later.
    name: opengrep baseline names files that exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_opengrep_baseline.py

  opengrep:
    # Full-tree SAST on a schedule rather than per-PR: a `--config auto` pass takes minutes and this
    # repo is 7k lines, so per-PR it would mostly re-report the same known-and-reviewed findings.
    # The reviewed baseline is scripts/check_opengrep_baseline.py, NOT a comment here: one list in
    # two places is how the first copy rotted.
    #
    # continue-on-error stays. `--config auto` pulls rules from a registry that changes with no PR,
    # which is precisely the external feed the header commits to not gating on. The structural half
    # above gates instead, and it has no feed.
    name: opengrep (scheduled full-tree SAST)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install opengrep v1.25.0 (pinned binary + checksum)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opengrep-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/opengrep-bin/opengrep" \
            https://github.com/opengrep/opengrep/releases/download/v1.25.0/opengrep_manylinux_x86
          echo "9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33  $RUNNER_TEMP/opengrep-bin/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep-bin/opengrep"
          echo "$RUNNER_TEMP/opengrep-bin" >> "$GITHUB_PATH"
      - name: opengrep scan
        # No `--error`: a raw finding count is not the verdict. Every finding here is either already
        # reviewed or is news, and only the baseline knows which. `--json --output` exits 0 with
        # findings present, so the next step is what decides.
        run: opengrep scan --config auto --json --output opengrep.json .
      - name: compare findings to the reviewed baseline
        # Fails on a finding absent from the baseline, and warns on an accepted entry that no longer
        # fires so the record gets trimmed instead of quietly becoming fiction. Also floors on
        # paths.scanned: a scan that covered nothing emits `results: []`, byte-identical to a clean
        # tree, which is the same trap --fail-on-scan-errors closes for trufflehog above.
        run: python scripts/check_opengrep_baseline.py --findings opengrep.json
