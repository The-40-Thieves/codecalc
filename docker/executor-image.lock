# codecalc strict executor image — digest lock (THE-828)
#
# The production strict EXECUTION path pins the executor image by an immutable
# @sha256: digest, never by a mutable tag. This file records the digest of the
# multi-architecture image published to GHCR by
# .github/workflows/publish-executor-image.yml.
#
# codecalc.strict_runtime.published_strict_image() returns the FIRST line below
# that matches ghcr.io/...@sha256:<64 hex>; every comment and the placeholder are
# ignored. Until the workflow is dispatched no digest is pinned, so the execution
# path (strict_execution_config) FAILS CLOSED — it does NOT fall back to the
# mutable local diagnostic tag (codecalc-exec:strict), which doctor and the
# conformance suite keep using unchanged.
#
# To publish and pin: run the publish-executor-image workflow (workflow_dispatch).
# It rewrites the line below with the real digest and commits it back, e.g.
#   ghcr.io/the-40-thieves/codecalc-exec@sha256:0123...cdef
unpublished
