# The one file with something to except: `codecalc/_measured_safe_callables.json` is a
# machine-generated list of SymPy identifiers (`sring`, `numer`, `Unequality`, ...), not prose —
# regenerated by `scripts/measure_safe_callables.py`, never hand-edited. Everything else in the
# repo is still spelled to a genuine zero (see ci-quality.yml).
[files]
extend-exclude = ["codecalc/_measured_safe_callables.json"]

# `Unequality` is a real SymPy class name (confirmed live: `sympy.Unequality`), not a typo for
# "Inequality" — needed here too since CHANGELOG.md (prose, not excluded above) names it directly
# as one of the round-15 allowlist departures.
[default.extend-words]
Unequality = "Unequality"
